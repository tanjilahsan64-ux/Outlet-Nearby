<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Outlet Nearby Ultra Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        :root {
            /* Canvas & Surfaces */
            --bg-dark: #0b0f17;
            --surface-glass: rgba(17, 24, 39, 0.75);
            --surface-card: rgba(24, 32, 47, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(99, 102, 241, 0.3);
            
            /* Primary Accent (Indigo) */
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --accent-cyan: #38bdf8;
            
            /* Status Indicators */
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-rose: #f43f5e;
            --accent-rose-glow: rgba(244, 63, 94, 0.2);
            
            /* Text Hierarchy */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.06) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 560px;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(11, 15, 23, 0.85);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { display: flex; align-items: center; gap: 10px; }

        .brand-icon {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .brand-icon svg { width: 18px; height: 18px; stroke: #fff; }

        h1 {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-upload-compact {
            background: rgba(99, 102, 241, 0.12);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-upload-compact:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--primary);
            color: #fff;
        }

        .gps-status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 10px; border-radius: 20px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid var(--border-glass);
            font-size: 0.72rem; font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-rose); }
        .status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        input[type="file"] { display: none; }

        .container {
            width: 100%; max-width: 560px;
            padding: 12px 16px; display: flex;
            flex-direction: column; gap: 12px;
        }

        .glass-card-compact {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 14px; padding: 12px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .view-toggle-bar {
            display: flex;
            background: rgba(11, 15, 23, 0.6);
            padding: 4px; border-radius: 10px;
            border: 1px solid var(--border-glass);
            gap: 4px;
        }

        .tab-btn {
            flex: 1; padding: 7px 0; border: none;
            background: transparent; color: var(--text-muted);
            font-size: 0.78rem; font-weight: 700; border-radius: 7px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 6px; transition: all 0.25s ease;
        }

        .tab-btn svg { width: 14px; height: 14px; stroke: currentColor; }
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 10px var(--primary-glow); }

        .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .filter-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }

        .filter-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 4px 10px; border-radius: 14px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass);
            font-size: 0.72rem; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
        }

        .chip:hover { border-color: rgba(255, 255, 255, 0.2); color: var(--text-primary); }
        .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 2px 8px var(--primary-glow); }

        .search-box { position: relative; }

        .search-input {
            width: 100%; padding: 10px 12px 10px 38px;
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 10px; color: var(--text-primary); font-size: 0.82rem; outline: none;
            transition: all 0.25s ease;
        }

        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-muted); }

        .outlet-card {
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
            position: relative; overflow: hidden; transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .outlet-card:hover { border-color: rgba(255, 255, 255, 0.15); }
        .outlet-card:active { transform: scale(0.988); }
        .outlet-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--primary); }
        .outlet-card.visited { background: rgba(16, 185, 129, 0.03); border-color: rgba(16, 185, 129, 0.2); }
        .outlet-card.visited::before { background: var(--accent-green); }

        .outlet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .outlet-code-row { display: flex; align-items: center; gap: 8px; }
        .outlet-code { font-size: 1rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.01em; }

        .visited-badge {
            background: rgba(16, 185, 129, 0.15); color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            font-size: 0.62rem; font-weight: 800; padding: 2px 7px;
            border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em;
        }

        .rso-text { font-size: 0.75rem; color: var(--text-muted); }
        .rso-text strong { color: var(--text-secondary); font-weight: 600; }

        .dist-pill {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2);
            color: #818cf8; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
        }

        .status-tag { font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 5px; }
        .status-y { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
        .status-n { background: rgba(244, 63, 94, 0.12); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.25); }

        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-glass); gap: 6px;
        }

        .check-container {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); cursor: pointer;
        }

        .custom-check {
            width: 16px; height: 16px; border-radius: 5px;
            border: 1px solid var(--text-muted); display: flex; align-items: center;
            justify-content: center; background: rgba(0, 0, 0, 0.2); transition: all 0.2s ease;
        }

        .check-container input { display: none; }
        .check-container input:checked ~ .custom-check { background: var(--accent-green); border-color: var(--accent-green); }
        .custom-check svg { width: 9px; height: 9px; stroke: #0b0f17; stroke-width: 3; opacity: 0; }
        .check-container input:checked ~ .custom-check svg { opacity: 1; }

        .btn-action-group { display: flex; gap: 6px; }

        .btn-sm {
            background: rgba(255, 255, 255, 0.04); color: var(--text-secondary);
            border: 1px solid var(--border-glass); padding: 5px 10px; border-radius: 6px;
            font-size: 0.72rem; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; gap: 4px; transition: all 0.2s ease;
        }

        .btn-sm:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); border-color: rgba(255, 255, 255, 0.2); }

        .btn-nav {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .btn-nav:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary); color: #fff;
        }

        /* Map View Container */
        #mapView {
            display: none; width: 100%; height: 68vh;
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); position: relative;
        }

        #map { width: 100%; height: 100%; background: #0b0f17; }

        .user-gps-container { 
            position: relative; 
            width: 24px; 
            height: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .user-heading-cone {
            position: absolute; 
            width: 0; 
            height: 0;
            border-left: 8px solid transparent; 
            border-right: 8px solid transparent;
            border-bottom: 22px solid rgba(99, 102, 241, 0.85); 
            top: -12px;
            transform-origin: 50% 100%; 
            pointer-events: none;
            transition: transform 0.15s ease-out;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .user-gps-dot {
            width: 14px; height: 14px; background: #6366f1;
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 12px #6366f1; z-index: 2;
        }

        /* Bottom Control Bar */
        .bottom-bar {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 24px); max-width: 520px;
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-highlight);
            border-radius: 14px; padding: 10px 14px; display: flex;
            align-items: center; justify-content: space-between;
            box-shadow: 0 16px 36px rgba(0,0,0,0.6); z-index: 500;
        }

        .counter-info { display: flex; flex-direction: column; }
        .counter-num { font-size: 0.85rem; font-weight: 800; color: var(--text-primary); }
        .counter-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; }

        .btn-group-bottom { display: flex; gap: 8px; }

        .btn-export {
            background: rgba(16, 185, 129, 0.12); color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 12px;
            border-radius: 8px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-export:hover { background: rgba(16, 185, 129, 0.25); border-color: var(--accent-green); }

        .btn-reset-small {
            background: rgba(244, 63, 94, 0.1); color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.25); padding: 6px 12px;
            border-radius: 8px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset-small:hover { background: rgba(244, 63, 94, 0.2); border-color: var(--accent-rose); }

        /* Modals & Popups */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); z-index: 1000;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--bg-dark); border: 1px solid var(--border-highlight);
            border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
            padding: 18px; transform: translateY(100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column; gap: 12px;
        }

        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        .modal-close:hover { color: var(--text-primary); }

        .app-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }

        .app-opt {
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 10px; padding: 12px 6px; display: flex; flex-direction: column;
            align-items: center; gap: 6px; cursor: pointer; text-decoration: none;
            color: var(--text-primary); font-size: 0.72rem; font-weight: 700;
            transition: all 0.2s ease;
        }

        .app-opt:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }

        .map-popup-btn {
            width: 100%; margin-top: 6px; padding: 8px; border-radius: 8px;
            border: none; background: var(--primary); color: #fff; font-weight: 700;
            font-size: 0.75rem; cursor: pointer; transition: background 0.2s ease;
        }

        .map-popup-btn:hover { background: #4f46e5; }

        .notes-input {
            width: 100%; height: 80px; background: var(--surface-card);
            border: 1px solid var(--border-glass); border-radius: 8px; padding: 10px;
            color: #fff; font-size: 0.82rem; outline: none; resize: none;
        }

        .notes-input:focus { border-color: var(--primary); }

        .toast {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(99, 102, 241, 0.95); color: #fff;
            padding: 8px 18px; border-radius: 30px; font-weight: 700; font-size: 0.78rem;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35); z-index: 1000;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand">
            <div class="brand-icon">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <h1>Outlet Nearby Ultra</h1>
        </div>
        <div class="header-actions">
            <label for="csvFileInput" class="btn-upload-compact">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                Import CSV
            </label>
            <input type="file" id="csvFileInput" accept=".csv">
            <div class="gps-status-pill" onclick="requestCompassPermission()">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">GPS</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="glass-card-compact">
        <div class="view-toggle-bar">
            <button id="listViewTab" class="tab-btn active" onclick="switchView('list')">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                List
            </button>
            <button id="mapViewTab" class="tab-btn" onclick="switchView('map')">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                Map
            </button>
        </div>

        <div class="filter-row">
            <span class="filter-label">Radius</span>
            <div class="filter-chips">
                <div class="chip" onclick="setRadius(25, this)">25m</div>
                <div class="chip active" onclick="setRadius(50, this)">50m</div>
                <div class="chip" onclick="setRadius(100, this)">100m</div>
                <div class="chip" onclick="setRadius(500, this)">500m</div>
                <div class="chip" onclick="setRadius(50000, this)">All</div>
            </div>
        </div>
        
        <div class="filter-row">
            <span class="filter-label">Status</span>
            <div class="filter-chips">
                <div class="chip active" onclick="setStatusFilter('ALL', this)">All</div>
                <div class="chip" onclick="setStatusFilter('UNVISITED', this)">Unvisited</div>
                <div class="chip" onclick="setStatusFilter('VISITED', this)">Visited</div>
                <div class="chip" onclick="setStatusFilter('STATUS_Y', this)">Status Y</div>
                <div class="chip" onclick="setStatusFilter('STATUS_N', this)">Status N</div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <svg class="search-icon" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search Code, RSO, or Status..." oninput="updateNearbyList()">
    </div>

    <div id="listView">
        <div id="retailerList">
            <div class="empty-card" style="text-align: center; padding: 28px 16px; background: var(--surface-glass); border: 1px dashed var(--border-glass); border-radius: 14px;">
                <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">No Outlets Loaded</p>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Tap "Import CSV" at the top right to start.</p>
            </div>
        </div>
    </div>

    <div id="mapView">
        <div id="map"></div>
    </div>
</div>

<div class="bottom-bar">
    <div class="counter-info">
        <span id="retailerCount" class="counter-num">0 Outlets</span>
        <span id="visitedCount" class="counter-label">0 visited this month</span>
    </div>
    <div class="btn-group-bottom">
        <button class="btn-export" onclick="exportVisitReport()">Export CSV</button>
        <button class="btn-reset-small" onclick="clearVisitHistory()">Reset Month</button>
    </div>
</div>

<!-- Navigation Modal -->
<div id="navModal" class="modal-overlay" onclick="closeModal('navModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title">Navigate To Outlet</span>
            <button class="modal-close" onclick="closeModal('navModal')">&times;</button>
        </div>
        <p style="font-size:0.75rem; color:var(--text-muted);" id="navModalSub">Select preferred map provider:</p>
        <div class="app-picker-grid">
            <a id="gmapsLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="#818cf8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                Google
            </a>
            <a id="wazeLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="#38bdf8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Waze
            </a>
            <a id="appleLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="#94a3b8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                Apple
            </a>
        </div>
        <button class="map-popup-btn" style="margin-top:8px;" id="drawRouteBtn">Draw Live Route</button>
    </div>
</div>

<!-- Notes Modal -->
<div id="notesModal" class="modal-overlay" onclick="closeModal('notesModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="notesModalTitle">Outlet Details</span>
            <button class="modal-close" onclick="closeModal('notesModal')">&times;</button>
        </div>
        <textarea id="noteInput" class="notes-input" placeholder="Type visit details, order notes..."></textarea>
        <div style="display:flex; gap:8px; align-items:center;">
            <label class="btn-sm" style="flex:1; justify-content:center; cursor:pointer;">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Watermarked Camera
                <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handleWatermarkedPhotoUpload(event)">
            </label>
            <button class="map-popup-btn" style="flex:1; margin:0;" onclick="saveNotes()">Save Details</button>
        </div>
        <div id="photoPreviewContainer" style="display:none; margin-top:6px;">
            <img id="photoPreview" style="width:100%; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--border-glass);" src="" alt="Preview">
        </div>
    </div>
</div>

<div id="toast" class="toast"><span id="toastMsg">Ready</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'outlet-ultra-indigo-v2';
            self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['/']))));
            self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    let db;
    const dbReq = indexedDB.open("OutletUltraDB", 2);
    dbReq.onupgradeneeded = e => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("outlets")) {
            db.createObjectStore("outlets", { keyPath: "code" });
        }
    };
    dbReq.onsuccess = e => {
        db = e.target.result;
        loadOutletsFromStorage();
    };

    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist();
    }

    let retailers = [];
    let currentLat = null, currentLon = null, currentAccuracy = 0, currentHeading = 0;
    let deviceHeading = 0;
    let targetRadius = 50;
    let statusFilter = 'ALL';
    let activeView = 'list';

    let map = null, userMarker = null, userAccuracyCircle = null, storeClusterLayer = null;
    let activePopupMarker = null, popupTimer = null, osrmPolyline = null;
    let activeNoteStoreCode = null, tempPhotoBase64 = null;

    function loadOutletsFromStorage() {
        if (!db) return;
        const tx = db.transaction("outlets", "readonly");
        const store = tx.objectStore("outlets");
        const req = store.getAll();
        req.onsuccess = () => {
            retailers = req.result || [];
            updateCounters();
            updateNearbyList();
        };
    }

    function saveAllOutletsToDB() {
        if (!db) return;
        const tx = db.transaction("outlets", "readwrite");
        const store = tx.objectStore("outlets");
        store.clear();
        retailers.forEach(item => store.put(item));
    }

    function switchView(view) {
        activeView = view;
        const listViewEl = document.getElementById('listView');
        const mapViewEl = document.getElementById('mapView');
        const listTab = document.getElementById('listViewTab');
        const mapTab = document.getElementById('mapViewTab');

        if (view === 'list') {
            listViewEl.style.display = 'block';
            mapViewEl.style.display = 'none';
            listTab.classList.add('active');
            mapTab.classList.remove('active');
        } else {
            listViewEl.style.display = 'none';
            mapViewEl.style.display = 'block';
            mapTab.classList.add('active');
            listTab.classList.remove('active');

            if (!map) initMap();
            else setTimeout(() => map.invalidateSize(), 100);
            updateMapView();
        }
    }

    function initMap() {
        const startLat = currentLat || 23.8103;
        const startLon = currentLon || 90.4125;

        map = L.map('map', { zoomControl: false }).setView([startLat, startLon], 18);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            subdomains: 'abcd',
            attribution: '&copy; CartoDB'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        storeClusterLayer = L.markerClusterGroup({
            disableClusteringAtZoom: 17,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false
        }).addTo(map);

        map.on('popupopen', e => {
            activePopupMarker = e.popup._source;
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => map.closePopup(), 10000);
        });

        map.on('popupclose', () => {
            activePopupMarker = null;
            clearTimeout(popupTimer);
        });
    }

    function setRadius(meters, el) {
        targetRadius = meters;
        el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        updateNearbyList();
        showToast(meters >= 50000 ? "Showing All Outlets" : `Radius set to ${meters}m`);
    }

    function setStatusFilter(filterVal, el) {
        statusFilter = filterVal;
        el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        updateNearbyList();
    }

    function parseCSVLine(line) {
        const result = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') inQuotes = !inQuotes;
            else if (c === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else cur += c;
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => parseCSV(evt.target.result);
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;
        const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());
        let latIdx = headers.findIndex(h => h.includes('lat'));
        let lonIdx = headers.findIndex(h => h.includes('lon') || h.includes('lng'));

        retailers = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const cols = parseCSVLine(line);
            if (cols.length < 3) continue;

            let retailerCode = '';
            for (let c = 0; c < cols.length; c++) {
                if (/^R\d{5,7}$/i.test(cols[c].trim())) {
                    retailerCode = cols[c].trim().toUpperCase();
                    break;
                }
            }
            if (!retailerCode && cols[2]) retailerCode = cols[2].trim();
            const rsoCode = cols[1] ? cols[1].trim() : 'N/A';
            let statusVal = cols[7] ? cols[7].trim().toUpperCase() : (cols.length >= 8 ? cols[cols.length - 1].trim().toUpperCase() : 'N/A');

            let lat = parseFloat(cols[latIdx !== -1 ? latIdx : 5]);
            let lon = parseFloat(cols[lonIdx !== -1 ? lonIdx : 6]);

            if (isNaN(lat) || isNaN(lon)) {
                for (let c = 0; c < cols.length; c++) {
                    const val = parseFloat(cols[c]);
                    if (!isNaN(val) && val > 5 && val < 40) lat = val;
                    if (!isNaN(val) && val > 60 && val < 100) lon = val;
                }
            }

            if (!isNaN(lat) && !isNaN(lon) && retailerCode) {
                retailers.push({
                    code: retailerCode,
                    rso: rsoCode,
                    lat: lat,
                    lon: lon,
                    status: statusVal,
                    visited: false,
                    notes: '',
                    visitedDate: null,
                    photo: null
                });
            }
        }

        saveAllOutletsToDB();
        updateCounters();
        updateNearbyList();
        showToast(`Loaded ${retailers.length} Outlets`);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI / 180;
        const φ2 = lat2 * Math.PI / 180;
        const Δφ = (lat2 - lat1) * Math.PI / 180;
        const Δλ = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c;
    }

    function getFilteredOutlets() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        return retailers.filter(item => {
            if (currentLat !== null && currentLon !== null) {
                item.dist = calculateDistance(currentLat, currentLon, item.lat, item.lon);
            } else {
                item.dist = Infinity;
            }

            const matchesSearch = !query || 
                item.code.toLowerCase().includes(query) || 
                item.rso.toLowerCase().includes(query) || 
                item.status.toLowerCase().includes(query);

            const matchesRadius = item.dist <= targetRadius;

            let matchesStatus = true;
            if (statusFilter === 'UNVISITED') matchesStatus = !item.visited;
            else if (statusFilter === 'VISITED') matchesStatus = item.visited;
            else if (statusFilter === 'STATUS_Y') matchesStatus = item.status === 'Y';
            else if (statusFilter === 'STATUS_N') matchesStatus = item.status === 'N';

            return matchesSearch && matchesRadius && matchesStatus;
        }).sort((a, b) => a.dist - b.dist);
    }

    function updateNearbyList() {
        const listContainer = document.getElementById('retailerList');
        const filtered = getFilteredOutlets();

        if (activeView === 'map') {
            updateMapView(filtered);
            return;
        }

        if (filtered.length === 0) {
            listContainer.innerHTML = `
                <div class="empty-card" style="text-align: center; padding: 28px 16px; background: var(--surface-glass); border: 1px dashed var(--border-glass); border-radius: 14px;">
                    <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">No Outlets Found</p>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Try expanding search radius or changing filters.</p>
                </div>`;
            return;
        }

        listContainer.innerHTML = filtered.map(item => {
            const distStr = item.dist !== Infinity ? (item.dist < 1000 ? `${Math.round(item.dist)}m` : `${(item.dist/1000).toFixed(1)}km`) : '--';
            const statusClass = item.status === 'Y' ? 'status-y' : (item.status === 'N' ? 'status-n' : '');

            return `
                <div class="outlet-card ${item.visited ? 'visited' : ''}">
                    <div class="outlet-header">
                        <div class="outlet-code-row">
                            <span class="outlet-code">${item.code}</span>
                            ${item.visited ? '<span class="visited-badge">Visited</span>' : ''}
                        </div>
                        <span class="dist-pill">${distStr}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">
                        <span class="rso-text">RSO: <strong>${item.rso}</strong></span>
                        <span class="status-tag ${statusClass}">Status: ${item.status}</span>
                    </div>
                    <div class="card-footer">
                        <label class="check-container">
                            <input type="checkbox" ${item.visited ? 'checked' : ''} onchange="toggleVisited('${item.code}', this.checked)">
                            <div class="custom-check">
                                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                            </div>
                            <span>Visited</span>
                        </label>
                        <div class="btn-action-group">
                            <button class="btn-sm" onclick="openNotesModal('${item.code}')">Details</button>
                            <button class="btn-sm btn-nav" onclick="openNavModal(${item.lat}, ${item.lon}, '${item.code}')">Navigate</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateMapView(filteredItems) {
        if (!map) return;
        const items = filteredItems || getFilteredOutlets();
        storeClusterLayer.clearLayers();

        items.forEach(item => {
            const iconHtml = `<div style="background:${item.visited ? '#10b981' : '#6366f1'}; width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 8px rgba(0,0,0,0.5);"></div>`;
            const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [12, 12], iconAnchor: [6, 6] });

            const marker = L.marker([item.lat, item.lon], { icon: customIcon });
            marker.bindPopup(`
                <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
                    <strong style="color:#111; font-size:0.9rem;">${item.code}</strong><br>
                    <span style="font-size:0.75rem; color:#555;">RSO: ${item.rso}</span><br>
                    <button class="map-popup-btn" onclick="openNavModal(${item.lat}, ${item.lon}, '${item.code}')">Navigate</button>
                </div>
            `);
            storeClusterLayer.addLayer(marker);
        });
    }

    function toggleVisited(code, isVisited) {
        const item = retailers.find(r => r.code === code);
        if (item) {
            item.visited = isVisited;
            item.visitedDate = isVisited ? new Date().toISOString() : null;
            saveAllOutletsToDB();
            updateCounters();
            updateNearbyList();
        }
    }

    function updateCounters() {
        const total = retailers.length;
        const visited = retailers.filter(r => r.visited).length;
        document.getElementById('retailerCount').innerText = `${total} Outlets`;
        document.getElementById('visitedCount').innerText = `${visited} visited this month`;
    }

    function requestCompassPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    }
                })
                .catch(console.error);
        } else {
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
    }

    function handleOrientation(event) {
        if (event.webkitCompassHeading) {
            deviceHeading = event.webkitCompassHeading;
        } else if (event.alpha) {
            deviceHeading = 360 - event.alpha;
        }
        updateUserMarkerHeading();
    }

    function updateUserMarkerHeading() {
        const cone = document.getElementById('userHeadingCone');
        if (cone) {
            cone.style.transform = `rotate(${deviceHeading}deg)`;
        }
    }

    function startGPS() {
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(pos => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                currentAccuracy = pos.coords.accuracy;

                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = 'GPS On';

                if (map) {
                    if (!userMarker) {
                        const userIcon = L.divIcon({
                            className: '',
                            html: `
                                <div class="user-gps-container">
                                    <div id="userHeadingCone" class="user-heading-cone"></div>
                                    <div class="user-gps-dot"></div>
                                </div>
                            `,
                            iconSize: [24, 24],
                            iconAnchor: [12, 12]
                        });
                        userMarker = L.marker([currentLat, currentLon], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
                        userAccuracyCircle = L.circle([currentLat, currentLon], { radius: currentAccuracy, color: '#6366f1', fillColor: '#6366f1', fillOpacity: 0.15, weight: 1 }).addTo(map);
                    } else {
                        userMarker.setLatLng([currentLat, currentLon]);
                        userAccuracyCircle.setLatLng([currentLat, currentLon]);
                        userAccuracyCircle.setRadius(currentAccuracy);
                    }
                }

                updateNearbyList();
            }, err => {
                document.getElementById('statusDot').classList.remove('active');
                document.getElementById('statusText').innerText = 'GPS Off';
            }, {
                enableHighAccuracy: true,
                maximumAge: 5000,
                timeout: 10000
            });
        }
    }

    let targetNavLat = null, targetNavLon = null;
    function openNavModal(lat, lon, code) {
        targetNavLat = lat;
        targetNavLon = lon;
        document.getElementById('navModalSub').innerText = `Target Outlet: ${code}`;
        document.getElementById('gmapsLink').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
        document.getElementById('wazeLink').href = `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`;
        document.getElementById('appleLink').href = `maps://maps.apple.com/?daddr=${lat},${lon}`;

        document.getElementById('drawRouteBtn').onclick = () => {
            closeModal('navModal');
            switchView('map');
            drawOSRMRoute(lat, lon);
        };

        document.getElementById('navModal').classList.add('active');
    }

    function drawOSRMRoute(destLat, destLon) {
        if (!currentLat || !currentLon) {
            showToast("GPS position needed for routing");
            return;
        }

        const url = `https://router.project-osrm.org/route/v1/driving/${currentLon},${currentLat};${destLon},${destLat}?overview=full&geometries=geojson`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.routes && data.routes[0]) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    if (osrmPolyline) map.removeLayer(osrmPolyline);
                    osrmPolyline = L.polyline(coords, { color: '#6366f1', weight: 5, opacity: 0.85 }).addTo(map);
                    map.fitBounds(osrmPolyline.getBounds(), { padding: [30, 30] });
                }
            })
            .catch(() => showToast("Error calculating route"));
    }

    function openNotesModal(code) {
        activeNoteStoreCode = code;
        const item = retailers.find(r => r.code === code);
        if (!item) return;

        document.getElementById('notesModalTitle').innerText = `Details: ${code}`;
        document.getElementById('noteInput').value = item.notes || '';

        const previewContainer = document.getElementById('photoPreviewContainer');
        const previewImg = document.getElementById('photoPreview');
        if (item.photo) {
            previewImg.src = item.photo;
            previewContainer.style.display = 'block';
        } else {
            previewContainer.style.display = 'none';
        }

        tempPhotoBase64 = item.photo || null;
        document.getElementById('notesModal').classList.add('active');
    }

    function handleWatermarkedPhotoUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = evt => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const now = new Date();
                const timeStr = now.toLocaleString();
                const locStr = currentLat ? `Lat: ${currentLat.toFixed(5)}, Lon: ${currentLon.toFixed(5)}` : 'GPS UnAvailable';
                const watermarkText = `${activeNoteStoreCode} | ${timeStr} | ${locStr}`;

                ctx.fillStyle = "rgba(11, 15, 23, 0.75)";
                ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
                ctx.font = `${Math.max(14, Math.floor(canvas.height / 30))}px 'Plus Jakarta Sans', sans-serif`;
                ctx.fillStyle = "#ffffff";
                ctx.fillText(watermarkText, 15, canvas.height - 12);

                tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('photoPreview').src = tempPhotoBase64;
                document.getElementById('photoPreviewContainer').style.display = 'block';
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }

    function saveNotes() {
        const item = retailers.find(r => r.code === activeNoteStoreCode);
        if (item) {
            item.notes = document.getElementById('noteInput').value;
            item.photo = tempPhotoBase64;
            saveAllOutletsToDB();
            showToast("Details Saved");
        }
        closeModal('notesModal');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function exportVisitReport() {
        if (retailers.length === 0) {
            showToast("No data to export");
            return;
        }

        let csv = "Retailer Code,RSO,Status,Visited,Visited Date,Notes\n";
        retailers.forEach(r => {
            csv += `"${r.code}","${r.rso}","${r.status}","${r.visited ? 'YES' : 'NO'}","${r.visitedDate || ''}","${(r.notes || '').replace(/"/g, '""')}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Outlet_Report_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
    }

    function clearVisitHistory() {
        if (confirm("Reset all visit marks and notes for this month?")) {
            retailers.forEach(r => {
                r.visited = false;
                r.visitedDate = null;
                r.notes = '';
                r.photo = null;
            });
            saveAllOutletsToDB();
            updateCounters();
            updateNearbyList();
            showToast("Month reset complete");
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    startGPS();
</script>
</body>
</html>
