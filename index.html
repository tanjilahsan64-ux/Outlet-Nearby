<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlet Nearby</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 16px; color: #3b82f6; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 16px; width: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .status-box { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #aaa; margin-top: 8px; }
        .dot { height: 10px; width: 10px; background-color: #ef4444; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot.active { background-color: #22c55e; }
        input[type="file"] { display: none; }
        .btn-upload { display: block; background: #2563eb; color: #fff; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; width: 100%; font-size: 1rem; }
        
        .retailer-card { background: #2a2a2a; border-left: 5px solid #3b82f6; border-radius: 8px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; transition: all 0.2s ease; }
        .retailer-card.visited { background: #1a221a; border-left-color: #10b981; opacity: 0.85; }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .retailer-info h3 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 6px; font-weight: bold; }
        .retailer-info p { font-size: 0.88rem; color: #d1d5db; margin-bottom: 4px; }
        .distance { font-weight: bold; color: #10b981; font-size: 0.85rem; margin-top: 4px; }
        
        .status-badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; display: inline-block; }
        .status-y { background: #065f46; color: #34d399; }
        .status-n { background: #991b1b; color: #fca5a5; }
        .visited-badge { background: #10b981; color: #000; font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-left: 6px; }

        .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 10px; border-top: 1px solid #3d3d3d; }
        .visit-check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #e5e7eb; cursor: pointer; font-weight: 500; }
        .visit-check input { width: 20px; height: 20px; accent-color: #10b981; cursor: pointer; }

        .btn-copy { background: #10b981; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 0.88rem; cursor: pointer; }
        .btn-copy:active { background: #059669; transform: scale(0.98); }
        .empty-state { text-align: center; color: #6b7280; margin-top: 24px; font-size: 0.95rem; }
        .toast { position: fixed; bottom: 20px; background: #10b981; color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 99; }
        
        .btn-reset { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h1>📍 Outlet Nearby</h1>

    <div class="card">
        <label for="csvFileInput" class="btn-upload">📁 Upload Retailers CSV</label>
        <input type="file" id="csvFileInput" accept=".csv">
        <div class="status-box">
            <span><span id="statusDot" class="dot"></span><span id="statusText">Awaiting GPS / CSV...</span></span>
            <span id="retailerCount">0 loaded</span>
        </div>
        <button class="btn-reset" onclick="clearVisitHistory()">🧹 Clear All Visit Marks</button>
    </div>

    <div id="retailerList">
        <div class="empty-state">Upload a CSV file and walk within 50m of an outlet to see nearby codes.</div>
    </div>
</div>

<div id="toast" class="toast">Code copied!</div>

<script>
    let retailers = [];
    let visitedSet = new Set(JSON.parse(localStorage.getItem('visited_retailers') || '[]'));
    let currentLat = null;
    let currentLon = null;

    // Load saved CSV data on startup
    const savedData = localStorage.getItem('retailer_data');
    if (savedData) {
        try {
            retailers = JSON.parse(savedData);
            document.getElementById('retailerCount').innerText = `${retailers.length} loaded`;
        } catch(e) {}
    }

    // Helper to robustly split CSV lines with quoted strings
    function parseCSVLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') { inQuotes = !inQuotes; }
            else if (c === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else { cur += c; }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    // CSV File Reader
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            parseCSV(evt.target.result);
        };
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;

        const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());

        // Find latitude and longitude column indices dynamically
        let latIdx = headers.findIndex(h => h.includes('lat'));
        let lonIdx = headers.findIndex(h => h.includes('lon') || h.includes('lng'));

        retailers = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const cols = parseCSVLine(line);
            if (cols.length < 3) continue;

            // Find Retailer Code (starts with R followed by digits, e.g. R603640)
            let retailerCode = '';
            for (let c = 0; c < cols.length; c++) {
                if (/^R\d{5,7}$/i.test(cols[c].trim())) {
                    retailerCode = cols[c].trim().toUpperCase();
                    break;
                }
            }
            // Fallback: Check Column C (Index 2)
            if (!retailerCode && cols[2]) retailerCode = cols[2].trim();

            // RSO Code: Column B (Index 1)
            const rsoCode = cols[1] ? cols[1].trim() : 'N/A';

            // Status Y/N: Column H (Index 7) or last column fallback
            let statusVal = 'N/A';
            if (cols[7]) {
                statusVal = cols[7].trim().toUpperCase();
            } else if (cols.length >= 8) {
                statusVal = cols[cols.length - 1].trim().toUpperCase();
            }

            // Coordinates detection
            let lat = parseFloat(cols[latIdx !== -1 ? latIdx : 5]);
            let lon = parseFloat(cols[lonIdx !== -1 ? lonIdx : 6]);

            // Fallback coordinate search across all columns if lat/lon not found
            if (isNaN(lat) || isNaN(lon)) {
                for (let c = 0; c < cols.length; c++) {
                    const val = parseFloat(cols[c]);
                    if (!isNaN(val) && val > 20 && val < 27) lat = val; // Lat range for BD
                    if (!isNaN(val) && val > 88 && val < 93) lon = val; // Lon range for BD
                }
            }

            if (!isNaN(lat) && !isNaN(lon) && retailerCode) {
                retailers.push({
                    code: retailerCode,
                    rsoCode: rsoCode,
                    lat: lat,
                    lon: lon,
                    status: statusVal
                });
            }
        }

        localStorage.setItem('retailer_data', JSON.stringify(retailers));
        document.getElementById('retailerCount').innerText = `${retailers.length} loaded`;
        showToast(`Loaded ${retailers.length} outlets`);
        updateNearbyList();
    }

    // Haversine Distance Calculation (Meters)
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    // Live Location Tracking
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            (pos) => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = "GPS Live";
                updateNearbyList();
            },
            (err) => {
                document.getElementById('statusText').innerText = "GPS Error: Allow location access";
            },
            { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
        );
    } else {
        document.getElementById('statusText').innerText = "Geolocation unsupported";
    }

    // Filter and Render Outlets within 50 Meters
    function updateNearbyList() {
        if (currentLat === null || currentLon === null || retailers.length === 0) return;

        const listContainer = document.getElementById('retailerList');
        const nearby = [];

        for (const item of retailers) {
            const dist = getDistanceMeters(currentLat, currentLon, item.lat, item.lon);
            if (dist <= 50) { // 50 meters radius
                nearby.push({ ...item, distance: Math.round(dist) });
            }
        }

        // Sort unvisited first, then by distance
        nearby.sort((a, b) => {
            const aVisited = visitedSet.has(a.code);
            const bVisited = visitedSet.has(b.code);
            if (aVisited !== bVisited) return aVisited ? 1 : -1;
            return a.distance - b.distance;
        });

        if (nearby.length === 0) {
            listContainer.innerHTML = '<div class="empty-state">No outlets found within 50 meters. Walk closer to a store.</div>';
            return;
        }

        listContainer.innerHTML = nearby.map(item => {
            const isVisited = visitedSet.has(item.code);
            const statusClass = item.status === 'Y' ? 'status-y' : (item.status === 'N' ? 'status-n' : '');
            
            return `
                <div class="retailer-card ${isVisited ? 'visited' : ''}">
                    <div class="card-header">
                        <div class="retailer-info">
                            <h3>${escapeHtml(item.code)} ${isVisited ? '<span class="visited-badge">Visited ✅</span>' : ''}</h3>
                            <p>RSO Code: <strong>${escapeHtml(item.rsoCode)}</strong></p>
                            <p>Status: <span class="status-badge ${statusClass}">${escapeHtml(item.status)}</span></p>
                            <div class="distance">📍 ${item.distance}m away</div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <label class="visit-check">
                            <input type="checkbox" ${isVisited ? 'checked' : ''} onchange="toggleVisited('${escapeHtml(item.code)}')">
                            Mark Visited
                        </label>
                        <button class="btn-copy" onclick="copyCode('${escapeHtml(item.code)}')">Copy Code</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleVisited(code) {
        if (visitedSet.has(code)) {
            visitedSet.delete(code);
            showToast(`Unmarked ${code}`);
        } else {
            visitedSet.add(code);
            showToast(`Marked ${code} as Visited`);
        }
        localStorage.setItem('visited_retailers', JSON.stringify(Array.from(visitedSet)));
        updateNearbyList();
    }

    function clearVisitHistory() {
        if (confirm("Reset all visited marks for today?")) {
            visitedSet.clear();
            localStorage.removeItem('visited_retailers');
            showToast("Visit history cleared");
            updateNearbyList();
        }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showToast(`Copied ${code}`);
        });
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }
</script>

</body>
</html>
