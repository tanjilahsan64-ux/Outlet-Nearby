<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlet Nearby Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map View -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <style>
        :root {
            --bg-dark: #090d16;
            --surface-glass: rgba(18, 24, 38, 0.75);
            --surface-card: rgba(26, 34, 53, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.18);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-rose: #f43f5e;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header */
        header {
            width: 100%;
            max-width: 560px;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(9, 13, 22, 0.85);
            border-bottom: 1px solid var(--border-glass);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-cyan) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .brand-icon svg {
            width: 18px;
            height: 18px;
            stroke: #fff;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .gps-status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-rose);
        }

        .status-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .last-sync {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* View Toggle Tabs */
        .view-toggle-container {
            width: 100%;
            max-width: 560px;
            padding: 12px 16px 0;
        }

        .view-toggle-bar {
            display: flex;
            background: rgba(18, 24, 38, 0.8);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-glass);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .tab-btn svg { width: 16px; height: 16px; stroke: currentColor; }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* Main Layout */
        .container {
            width: 100%;
            max-width: 560px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Glass Card Controls */
        .glass-card {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
        }

        .upload-dropzone {
            position: relative;
            border: 2px dashed rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            background: rgba(99, 102, 241, 0.03);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .upload-dropzone:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
        }

        .upload-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 6px;
        }

        .upload-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .upload-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        input[type="file"] { display: none; }

        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-glass);
        }

        .filter-chips {
            display: flex;
            gap: 6px;
        }

        .chip {
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 2px 10px var(--primary-glow);
        }

        /* Search Box */
        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            background: var(--surface-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
        }

        /* Outlet Cards */
        .outlet-card {
            background: var(--surface-card);
            border: 1px solid var(--border-glass);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .outlet-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            transition: background 0.3s ease;
        }

        .outlet-card.visited {
            background: rgba(16, 185, 129, 0.04);
            border-color: rgba(16, 185, 129, 0.15);
            opacity: 0.85;
        }

        .outlet-card.visited::before {
            background: var(--accent-green);
        }

        .outlet-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .outlet-title-area {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .outlet-code-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .outlet-code {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .visited-badge {
            background: var(--accent-green);
            color: #06110d;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .rso-text {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .rso-text strong {
            color: var(--text-primary);
        }

        .dist-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid var(--accent-green-glow);
            color: #34d399;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-tag {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .status-y { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-n { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-glass);
        }

        .check-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .custom-check {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 2px solid var(--border-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .check-container input { display: none; }

        .check-container input:checked ~ .custom-check {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .custom-check svg {
            width: 10px;
            height: 10px;
            stroke: #090d16;
            stroke-width: 3;
            opacity: 0;
        }

        .check-container input:checked ~ .custom-check svg { opacity: 1; }

        .btn-copy {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(6, 182, 212, 0.15) 100%);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .empty-card {
            text-align: center;
            padding: 32px 20px;
            background: var(--surface-glass);
            border: 1px dashed var(--border-glass);
            border-radius: 16px;
        }

        /* Map View Container */
        #mapView {
            display: none;
            width: 100%;
            height: 60vh;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0f172a;
        }

        /* Leaflet Dark Customization */
        .leaflet-popup-content-wrapper {
            background: rgba(18, 24, 38, 0.95) !important;
            color: #f8fafc !important;
            border: 1px solid var(--border-highlight);
            backdrop-filter: blur(10px);
            border-radius: 12px !important;
        }

        .leaflet-popup-tip {
            background: rgba(18, 24, 38, 0.95) !important;
        }

        .leaflet-popup-content {
            margin: 12px 14px !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .map-popup-btn {
            width: 100%;
            margin-top: 8px;
            padding: 6px;
            border-radius: 6px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .map-nav-btn {
            display: inline-block;
            text-align: center;
            width: 100%;
            margin-top: 4px;
            padding: 6px;
            border-radius: 6px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 0.75rem;
            text-decoration: none;
        }

        /* Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 520px;
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-highlight);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 500;
        }

        .counter-info { display: flex; flex-direction: column; }
        .counter-num { font-size: 0.88rem; font-weight: 800; color: var(--text-primary); }
        .counter-label { font-size: 0.68rem; color: var(--text-muted); }

        .btn-reset-small {
            background: rgba(244, 63, 94, 0.1);
            color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.25);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(16, 185, 129, 0.95);
            color: #042f2e;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.825rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="brand">
            <div class="brand-icon">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <h1>Outlet Nearby</h1>
        </div>
        <div class="status-container">
            <div class="gps-status-pill">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">Awaiting GPS...</span>
            </div>
            <span id="lastSyncText" class="last-sync">Not updated yet</span>
        </div>
    </div>
</header>

<div class="view-toggle-container">
    <div class="view-toggle-bar">
        <button id="listViewTab" class="tab-btn active" onclick="switchView('list')">
            <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
            List View
        </button>
        <button id="mapViewTab" class="tab-btn" onclick="switchView('map')">
            <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
            Map View
        </button>
    </div>
</div>

<div class="container">
    <div class="glass-card">
        <label for="csvFileInput" class="upload-dropzone">
            <div class="upload-icon">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            </div>
            <div class="upload-title">Drop CSV file or tap to browse</div>
            <div class="upload-sub">Supports auto retailer column extraction</div>
        </label>
        <input type="file" id="csvFileInput" accept=".csv">

        <div class="filter-bar">
            <span style="font-size:0.72rem; color:var(--text-muted); font-weight:600;">Radius:</span>
            <div class="filter-chips">
                <div class="chip" onclick="setRadius(25, this)">25m</div>
                <div class="chip active" onclick="setRadius(50, this)">50m</div>
                <div class="chip" onclick="setRadius(100, this)">100m</div>
                <div class="chip" onclick="setRadius(500, this)">500m</div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <svg class="search-icon" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search code or RSO..." oninput="updateNearbyList()">
    </div>

    <!-- Container for List View -->
    <div id="listView">
        <div id="retailerList">
            <div class="empty-card">
                <p style="font-size: 0.9rem; font-weight: 700; color: var(--text-primary);">No Outlets Loaded</p>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Upload a CSV file and enable GPS location.</p>
            </div>
        </div>
    </div>

    <!-- Container for Map View -->
    <div id="mapView">
        <div id="map"></div>
    </div>
</div>

<div class="bottom-bar">
    <div class="counter-info">
        <span id="retailerCount" class="counter-num">0 Loaded</span>
        <span id="visitedCount" class="counter-label">0 visited today</span>
    </div>
    <button class="btn-reset-small" onclick="clearVisitHistory()">Reset Visits</button>
</div>

<div id="toast" class="toast"><span id="toastMsg">Copied!</span></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<script>
    let retailers = [];
    let visitedSet = new Set(JSON.parse(localStorage.getItem('visited_retailers') || '[]'));
    let currentLat = null;
    let currentLon = null;
    let targetRadius = 50;
    let lastRefreshTime = null;
    let activeView = 'list';

    // Map Variables
    let map = null;
    let userMarker = null;
    let radiusCircle = null;
    let storeMarkersLayer = null;

    // Load initial cached dataset
    const savedData = localStorage.getItem('retailer_data');
    if (savedData) {
        try {
            retailers = JSON.parse(savedData);
            updateCounters();
        } catch(e) {}
    }

    // Refresh Time Counter
    setInterval(() => {
        if (!lastRefreshTime) return;
        const secondsAgo = Math.floor((Date.now() - lastRefreshTime) / 1000);
        document.getElementById('lastSyncText').innerText = 
            secondsAgo < 2 ? 'Updated just now' : `Refreshed ${secondsAgo}s ago`;
    }, 1000);

    function switchView(view) {
        activeView = view;
        const listViewEl = document.getElementById('listView');
        const mapViewEl = document.getElementById('mapView');
        const listTab = document.getElementById('listViewTab');
        const mapTab = document.getElementById('mapViewTab');

        if (view === 'list') {
            listViewEl.style.display = 'block';
            mapViewEl.style.display = 'none';
            listTab.classList.add('active');
            mapTab.classList.remove('active');
        } else {
            listViewEl.style.display = 'none';
            mapViewEl.style.display = 'block';
            mapTab.classList.add('active');
            listTab.classList.remove('active');

            if (!map) {
                initMap();
            } else {
                setTimeout(() => map.invalidateSize(), 100);
            }
            updateMapView();
        }
    }

    function initMap() {
        const startLat = currentLat || 23.8103;
        const startLon = currentLon || 90.4125;

        map = L.map('map', { zoomControl: false }).setView([startLat, startLon], 18);

        // Google Maps Street View Layer (Free / No API Key required)
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        storeMarkersLayer = L.layerGroup().addTo(map);
    }

    function setRadius(meters, el) {
        targetRadius = meters;
        document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        updateNearbyList();
        showToast(`Radius set to ${meters}m`);
    }

    function parseCSVLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') { inQuotes = !inQuotes; }
            else if (c === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else { cur += c; }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) { parseCSV(evt.target.result); };
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;

        const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());
        let latIdx = headers.findIndex(h => h.includes('lat'));
        let lonIdx = headers.findIndex(h => h.includes('lon') || h.includes('lng'));

        retailers = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const cols = parseCSVLine(line);
            if (cols.length < 3) continue;

            let retailerCode = '';
            for (let c = 0; c < cols.length; c++) {
                if (/^R\d{5,7}$/i.test(cols[c].trim())) {
                    retailerCode = cols[c].trim().toUpperCase();
                    break;
                }
            }

            if (!retailerCode && cols[2]) retailerCode = cols[2].trim();
            const rsoCode = cols[1] ? cols[1].trim() : 'N/A';

            let statusVal = 'N/A';
            if (cols[7]) {
                statusVal = cols[7].trim().toUpperCase();
            } else if (cols.length >= 8) {
                statusVal = cols[cols.length - 1].trim().toUpperCase();
            }

            let lat = parseFloat(cols[latIdx !== -1 ? latIdx : 5]);
            let lon = parseFloat(cols[lonIdx !== -1 ? lonIdx : 6]);

            if (isNaN(lat) || isNaN(lon)) {
                for (let c = 0; c < cols.length; c++) {
                    const val = parseFloat(cols[c]);
                    if (!isNaN(val) && val > 5 && val < 40) lat = val;
                    if (!isNaN(val) && val > 60 && val < 100) lon = val;
                }
            }

            if (!isNaN(lat) && !isNaN(lon) && retailerCode) {
                retailers.push({
                    code: retailerCode,
                    rsoCode: rsoCode,
                    lat: lat,
                    lon: lon,
                    status: statusVal
                });
            }
        }

        localStorage.setItem('retailer_data', JSON.stringify(retailers));
        updateCounters();
        showToast(`Loaded ${retailers.length} outlets`);
        updateNearbyList();
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            (pos) => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                lastRefreshTime = Date.now();
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = "GPS Live";
                updateNearbyList();
            },
            () => { document.getElementById('statusText').innerText = "GPS Offline"; },
            { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
        );
    }

    function getNearbyFilteredData() {
        if (currentLat === null || currentLon === null || retailers.length === 0) return [];

        const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
        const nearby = [];

        for (const item of retailers) {
            const dist = getDistanceMeters(currentLat, currentLon, item.lat, item.lon);
            if (dist <= targetRadius) {
                if (!searchVal || item.code.toLowerCase().includes(searchVal) || item.rsoCode.toLowerCase().includes(searchVal)) {
                    nearby.push({ ...item, distance: Math.round(dist) });
                }
            }
        }

        return nearby.sort((a, b) => {
            const aVisited = visitedSet.has(a.code);
            const bVisited = visitedSet.has(b.code);
            if (aVisited !== bVisited) return aVisited ? 1 : -1;
            return a.distance - b.distance;
        });
    }

    function updateNearbyList() {
        const nearby = getNearbyFilteredData();

        if (activeView === 'map') {
            updateMapView(nearby);
            return;
        }

        const listContainer = document.getElementById('retailerList');

        if (nearby.length === 0) {
            listContainer.innerHTML = `
                <div class="empty-card">
                    <p style="font-size: 0.9rem; font-weight: 700; color: var(--text-primary);">No stores within ${targetRadius}m</p>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Walk closer or adjust your radius.</p>
                </div>`;
            return;
        }

        if (listContainer.querySelector('.empty-card')) {
            listContainer.innerHTML = '';
        }

        const existingCards = new Map();
        listContainer.querySelectorAll('.outlet-card').forEach(card => {
            existingCards.set(card.getAttribute('data-code'), card);
        });

        nearby.forEach((item) => {
            const isVisited = visitedSet.has(item.code);
            let card = existingCards.get(item.code);

            if (card) {
                const distEl = card.querySelector('.dist-val');
                if (distEl) distEl.innerText = `${item.distance}m`;

                const checkbox = card.querySelector('.visit-input');
                if (checkbox && checkbox.checked !== isVisited) {
                    checkbox.checked = isVisited;
                }

                if (isVisited) card.classList.add('visited');
                else card.classList.remove('visited');

                const badge = card.querySelector('.visited-badge');
                if (badge) badge.style.display = isVisited ? 'inline-block' : 'none';

                existingCards.delete(item.code);
            } else {
                const statusClass = item.status === 'Y' ? 'status-y' : (item.status === 'N' ? 'status-n' : '');
                card = document.createElement('div');
                card.className = `outlet-card ${isVisited ? 'visited' : ''}`;
                card.setAttribute('data-code', item.code);

                card.innerHTML = `
                    <div class="outlet-header">
                        <div class="outlet-title-area">
                            <div class="outlet-code-row">
                                <span class="outlet-code">${escapeHtml(item.code)}</span>
                                <span class="visited-badge" style="display: ${isVisited ? 'inline-block' : 'none'};">Visited</span>
                            </div>
                            <span class="rso-text">RSO Code: <strong>${escapeHtml(item.rsoCode)}</strong></span>
                        </div>
                        <div class="dist-pill">
                            <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                            <span class="dist-val">${item.distance}m</span>
                        </div>
                    </div>
                    <div>
                        <span class="status-tag ${statusClass}">STATUS: ${escapeHtml(item.status)}</span>
                    </div>
                    <div class="card-footer">
                        <label class="check-container">
                            <input type="checkbox" class="visit-input" ${isVisited ? 'checked' : ''} onchange="toggleVisited('${escapeHtml(item.code)}')">
                            <div class="custom-check">
                                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                            </div>
                            Mark Visited
                        </label>
                        <button class="btn-copy" onclick="copyCode('${escapeHtml(item.code)}')">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                            Copy
                        </button>
                    </div>
                `;
            }
            listContainer.appendChild(card);
        });

        existingCards.forEach(card => card.remove());
    }

    // Map Render Engine
    function updateMapView(data) {
        if (!map) return;
        const stores = data || getNearbyFilteredData();

        if (currentLat !== null && currentLon !== null) {
            // User Location Marker
            if (!userMarker) {
                const userIcon = L.divIcon({
                    className: 'user-pin',
                    html: `<div style="width:16px;height:16px;background:#6366f1;border:3px solid white;border-radius:50%;box-shadow:0 0 12px #6366f1;"></div>`,
                    iconSize: [16, 16]
                });
                userMarker = L.marker([currentLat, currentLon], { icon: userIcon }).addTo(map);
                map.panTo([currentLat, currentLon]);
            } else {
                userMarker.setLatLng([currentLat, currentLon]);
            }

            // Radius Circle Overlay
            if (!radiusCircle) {
                radiusCircle = L.circle([currentLat, currentLon], {
                    radius: targetRadius,
                    color: '#6366f1',
                    fillColor: '#6366f1',
                    fillOpacity: 0.08,
                    weight: 1.5
                }).addTo(map);
            } else {
                radiusCircle.setLatLng([currentLat, currentLon]);
                radiusCircle.setRadius(targetRadius);
            }
        }

        // Draw Store Pins
        storeMarkersLayer.clearLayers();

        stores.forEach(item => {
            const isVisited = visitedSet.has(item.code);
            const pinColor = isVisited ? '#10b981' : '#06b6d4';

            const customPin = L.divIcon({
                className: 'store-pin',
                html: `<div style="background:${pinColor};width:22px;height:22px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,0.5);font-size:10px;font-weight:800;color:#000;">${isVisited ? '✓' : ''}</div>`,
                iconSize: [22, 22]
            });

            const marker = L.marker([item.lat, item.lon], { icon: customPin });
            
            const popupContent = `
                <div style="font-size:0.85rem; font-weight:800; color:#38bdf8; margin-bottom:2px;">${escapeHtml(item.code)}</div>
                <div style="font-size:0.75rem; color:#cbd5e1; margin-bottom:6px;">RSO: <strong>${escapeHtml(item.rsoCode)}</strong></div>
                <div style="font-size:0.72rem; color:#94a3b8;">Dist: ${item.distance}m</div>
                <button class="map-popup-btn" onclick="toggleVisited('${escapeHtml(item.code)}')">
                    ${isVisited ? 'Unmark Visited' : 'Mark Visited'}
                </button>
                <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lon}" target="_blank" class="map-nav-btn">
                    Get Directions
                </a>
            `;

            marker.bindPopup(popupContent);
            storeMarkersLayer.addLayer(marker);
        });
    }

    function toggleVisited(code) {
        if (visitedSet.has(code)) {
            visitedSet.delete(code);
            showToast(`Unmarked ${code}`);
        } else {
            visitedSet.add(code);
            showToast(`Marked ${code} visited`);
        }
        localStorage.setItem('visited_retailers', JSON.stringify(Array.from(visitedSet)));
        updateCounters();
        updateNearbyList();
        if (activeView === 'map') updateMapView();
    }

    function clearVisitHistory() {
        if (confirm("Reset all visit markings?")) {
            visitedSet.clear();
            localStorage.removeItem('visited_retailers');
            updateCounters();
            showToast("Visit history reset");
            updateNearbyList();
            if (activeView === 'map') updateMapView();
        }
    }

    function updateCounters() {
        document.getElementById('retailerCount').innerText = `${retailers.length} Loaded`;
        document.getElementById('visitedCount').innerText = `${visitedSet.size} visited today`;
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => showToast(`Copied ${code}`));
    }

    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
</script>
</body>
