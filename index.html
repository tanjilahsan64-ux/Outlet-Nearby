<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlet Nearby</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        body { 
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            color: var(--text-main); 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }

        .container { 
            width: 100%; 
            max-width: 520px; 
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 { 
            font-size: 1.75rem; 
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px; 
            width: 100%; 
            box-shadow: var(--glass-glow); 
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="file"] { display: none; }

        .btn-upload { 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); 
            color: #fff; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            border: none; 
            width: 100%; 
            font-size: 0.95rem; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-upload:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        .btn-upload:active { transform: translateY(0); }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .status-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.825rem;
            color: var(--text-muted);
        }

        .dot { 
            height: 8px; 
            width: 8px; 
            background-color: var(--accent-red); 
            border-radius: 50%; 
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--accent-red);
        }

        .dot.active { 
            background-color: var(--accent-green); 
            box-shadow: 0 0 8px var(--accent-green);
        }

        .btn-reset { 
            background: transparent; 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            padding: 10px; 
            border-radius: 10px; 
            font-size: 0.8rem; 
            font-weight: 600;
            cursor: pointer; 
            width: 100%; 
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* Retailer List & Cards */
        .retailer-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border); 
            border-left: 4px solid var(--primary); 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 14px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: var(--glass-glow);
        }

        .retailer-card.visited { 
            background: rgba(16, 185, 129, 0.05); 
            border-left-color: var(--accent-green); 
            opacity: 0.75; 
        }

        .retailer-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
        }

        .retailer-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .retailer-info h3 { 
            font-size: 1.15rem; 
            color: #38bdf8; 
            font-weight: 700; 
            letter-spacing: 0.01em;
        }

        .retailer-info p { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 4px; 
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .retailer-info p strong {
            color: var(--text-main);
        }

        .distance-badge { 
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600; 
            color: var(--accent-green); 
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem; 
            margin-top: 4px; 
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-badge { 
            padding: 2px 8px; 
            border-radius: 6px; 
            font-weight: 700; 
            font-size: 0.7rem; 
            display: inline-block; 
            letter-spacing: 0.05em;
        }

        .status-y { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-n { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

        .visited-badge { 
            background: var(--accent-green); 
            color: #0f172a; 
            font-weight: 800; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 0.65rem; 
            text-transform: uppercase;
        }

        .card-actions { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 4px; 
            padding-top: 12px; 
            border-top: 1px solid rgba(255, 255, 255, 0.06); 
        }

        /* Custom Styled Checkbox */
        .visit-check { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 0.85rem; 
            color: var(--text-main); 
            cursor: pointer; 
            font-weight: 500; 
            user-select: none;
        }

        .visit-check input { 
            appearance: none;
            width: 18px; 
            height: 18px; 
            border: 2px solid var(--text-muted);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .visit-check input:checked {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
        }

        .visit-check input:checked::after {
            content: '✓';
            position: absolute;
            color: #0f172a;
            font-size: 12px;
            font-weight: 900;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .btn-copy { 
            background: rgba(16, 185, 129, 0.15); 
            color: #34d399; 
            border: 1px solid rgba(16, 185, 129, 0.3); 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 0.825rem; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }

        .btn-copy:hover {
            background: var(--accent-green);
            color: #0f172a;
        }

        .btn-copy:active { 
            transform: scale(0.96); 
        }

        .empty-state { 
            text-align: center; 
            color: var(--text-muted); 
            padding: 32px 16px; 
            font-size: 0.9rem; 
            line-height: 1.5;
            background: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 16px;
        }

        /* Toast UI */
        .toast { 
            position: fixed; 
            bottom: 24px; 
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b; 
            color: var(--text-main); 
            border: 1px solid var(--accent-green);
            padding: 10px 20px; 
            border-radius: 30px; 
            font-weight: 600; 
            font-size: 0.875rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); 
            z-index: 99; 
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Modern Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #1e293b;
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 16px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: var(--glass-glow);
        }

        .modal h4 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .modal p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .modal-btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .modal-btn-confirm {
            background: var(--accent-red);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📍 Outlet Nearby</h1>
    </header>

    <div class="card upload-section">
        <label for="csvFileInput" class="btn-upload">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            Upload Retailers CSV
        </label>
        <input type="file" id="csvFileInput" accept=".csv">

        <div class="status-grid">
            <div class="status-card">
                <span id="statusDot" class="dot"></span>
                <span id="statusText">Awaiting GPS...</span>
            </div>
            <div class="status-card">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                <span id="retailerCount">0 loaded</span>
            </div>
        </div>

        <button class="btn-reset" onclick="promptClearHistory()">🧹 Clear All Visit Marks</button>
    </div>

    <div id="retailerList">
        <div class="empty-state">
            Upload a CSV file and walk within 50m of an outlet to see nearby codes.
        </div>
    </div>
</div>

<div id="toast" class="toast">
    <span id="toastMsg">Code copied!</span>
</div>

<div id="confirmModal" class="modal-overlay">
    <div class="modal">
        <h4>Reset Visits?</h4>
        <p>This will clear all marked visit statuses for today.</p>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="modal-btn modal-btn-confirm" onclick="confirmClearHistory()">Reset</button>
        </div>
    </div>
</div>

<script>
    let retailers = [];
    let visitedSet = new Set(JSON.parse(localStorage.getItem('visited_retailers') || '[]'));
    let currentLat = null;
    let currentLon = null;

    // Load saved CSV data on startup
    const savedData = localStorage.getItem('retailer_data');
    if (savedData) {
        try {
            retailers = JSON.parse(savedData);
            document.getElementById('retailerCount').innerText = `${retailers.length} loaded`;
        } catch(e) {}
    }

    // Safely parse CSV lines handling quotes
    function parseCSVLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') { inQuotes = !inQuotes; }
            else if (c === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else { cur += c; }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    // CSV File Reader
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            parseCSV(evt.target.result);
        };
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;

        const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());

        let latIdx = headers.findIndex(h => h.includes('lat'));
        let lonIdx = headers.findIndex(h => h.includes('lon') || h.includes('lng'));

        retailers = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const cols = parseCSVLine(line);
            if (cols.length < 3) continue;

            // Target Retailer Code specifically matching R + 5-7 digits (e.g. R738883)
            let retailerCode = '';
            for (let c = 0; c < cols.length; c++) {
                if (/^R\d{5,7}$/i.test(cols[c].trim())) {
                    retailerCode = cols[c].trim().toUpperCase();
                    break;
                }
            }

            // Fallback to Column C (Index 2) if regex match isn't present
            if (!retailerCode && cols[2]) retailerCode = cols[2].trim();

            // RSO Code: Column B (Index 1)
            const rsoCode = cols[1] ? cols[1].trim() : 'N/A';

            // Status Y/N: Column H (Index 7)
            let statusVal = 'N/A';
            if (cols[7]) {
                statusVal = cols[7].trim().toUpperCase();
            } else if (cols.length >= 8) {
                statusVal = cols[cols.length - 1].trim().toUpperCase();
            }

            // Lat & Lon extraction
            let lat = parseFloat(cols[latIdx !== -1 ? latIdx : 5]);
            let lon = parseFloat(cols[lonIdx !== -1 ? lonIdx : 6]);

            if (isNaN(lat) || isNaN(lon)) {
                for (let c = 0; c < cols.length; c++) {
                    const val = parseFloat(cols[c]);
                    if (!isNaN(val) && val > 20 && val < 27) lat = val;
                    if (!isNaN(val) && val > 88 && val < 93) lon = val;
                }
            }

            if (!isNaN(lat) && !isNaN(lon) && retailerCode) {
                retailers.push({
                    code: retailerCode,
                    rsoCode: rsoCode,
                    lat: lat,
                    lon: lon,
                    status: statusVal
                });
            }
        }

        localStorage.setItem('retailer_data', JSON.stringify(retailers));
        document.getElementById('retailerCount').innerText = `${retailers.length} loaded`;
        showToast(`Loaded ${retailers.length} outlets`);
        updateNearbyList();
    }

    // Haversine Distance Calculation (Meters)
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
    }

    // Live Location Tracking
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
            (pos) => {
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
                document.getElementById('statusDot').classList.add('active');
                document.getElementById('statusText').innerText = "GPS Live";
                updateNearbyList();
            },
            (err) => {
                document.getElementById('statusText').innerText = "GPS Error Access Denied";
            },
            { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
        );
    } else {
        document.getElementById('statusText').innerText = "Geolocation Unsupported";
    }

    // Filter and Render Outlets within 50 Meters
    function updateNearbyList() {
        if (currentLat === null || currentLon === null || retailers.length === 0) return;

        const listContainer = document.getElementById('retailerList');
        const nearby = [];

        for (const item of retailers) {
            const dist = getDistanceMeters(currentLat, currentLon, item.lat, item.lon);
            if (dist <= 50) { // 50 meters radius
                nearby.push({ ...item, distance: Math.round(dist) });
            }
        }

        // Sort unvisited first, then by distance
        nearby.sort((a, b) => {
            const aVisited = visitedSet.has(a.code);
            const bVisited = visitedSet.has(b.code);
            if (aVisited !== bVisited) return aVisited ? 1 : -1;
            return a.distance - b.distance;
        });

        if (nearby.length === 0) {
            listContainer.innerHTML = '<div class="empty-state">No outlets found within 50 meters.<br>Walk closer to a store.</div>';
            return;
        }

        listContainer.innerHTML = nearby.map(item => {
            const isVisited = visitedSet.has(item.code);
            const statusClass = item.status === 'Y' ? 'status-y' : (item.status === 'N' ? 'status-n' : '');
            
            return `
                <div class="retailer-card ${isVisited ? 'visited' : ''}">
                    <div class="card-header">
                        <div class="retailer-info">
                            <div class="retailer-title">
                                <h3>${escapeHtml(item.code)}</h3>
                                ${isVisited ? '<span class="visited-badge">Visited</span>' : ''}
                            </div>
                            <p>RSO Code: <strong>${escapeHtml(item.rsoCode)}</strong></p>
                            <p>Status: <span class="status-badge ${statusClass}">${escapeHtml(item.status)}</span></p>
                            <div class="distance-badge">
                                <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                ${item.distance}m away
                            </div>
                        </div>
                    </div>
                    <div class="card-actions">
                        <label class="visit-check">
                            <input type="checkbox" ${isVisited ? 'checked' : ''} onchange="toggleVisited('${escapeHtml(item.code)}')">
                            Mark Visited
                        </label>
                        <button class="btn-copy" onclick="copyCode('${escapeHtml(item.code)}')">Copy Code</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleVisited(code) {
        if (visitedSet.has(code)) {
            visitedSet.delete(code);
            showToast(`Unmarked ${code}`);
        } else {
            visitedSet.add(code);
            showToast(`Marked ${code} as Visited`);
        }
        localStorage.setItem('visited_retailers', JSON.stringify(Array.from(visitedSet)));
        updateNearbyList();
    }

    function promptClearHistory() {
        document.getElementById('confirmModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('confirmModal').classList.remove('active');
    }

    function confirmClearHistory() {
        visitedSet.clear();
        localStorage.removeItem('visited_retailers');
        closeModal();
        showToast("Visit history cleared");
        updateNearbyList();
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).then(() => {
            showToast(`Copied ${code}`);
        });
    }

    let toastTimeout;
    function showToast(msg) {
        const t = document.getElementById('toast');
        const tMsg = document.getElementById('toastMsg');
        tMsg.innerText = msg;
        t.classList.add('show');
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { 
            t.classList.remove('show'); 
        }, 2200);
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }
</script>

</body>
</html>
