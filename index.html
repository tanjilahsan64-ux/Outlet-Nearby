<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Outlet Nearby Ultra Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        :root {
            --bg-dark: #090d16;
            --surface-glass: rgba(17, 24, 39, 0.85);
            --surface-card: rgba(24, 32, 51, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(99, 102, 241, 0.4);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent-cyan: #06b6d4;
            --accent-cyan-glow: rgba(6, 182, 212, 0.3);
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-rose: #f43f5e;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 560px;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(9, 13, 22, 0.85);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { display: flex; align-items: center; gap: 8px; }

        .brand-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-icon svg { width: 16px; height: 16px; stroke: #fff; }

        h1 {
            font-size: 1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-upload-compact {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.4);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-upload-compact:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .gps-status-pill {
            display: flex; align-items: center; gap: 5px;
            padding: 4px 8px; border-radius: 20px;
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid var(--border-glass);
            font-size: 0.7rem; font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-rose); }
        .status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        input[type="file"] { display: none; }

        .container {
            width: 100%; max-width: 560px;
            padding: 12px 16px; display: flex;
            flex-direction: column; gap: 10px;
        }

        .glass-card-compact {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 14px; padding: 10px 12px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .view-toggle-bar {
            display: flex;
            background: rgba(9, 13, 22, 0.6);
            padding: 3px; border-radius: 10px;
            border: 1px solid var(--border-glass);
            gap: 4px;
        }

        .tab-btn {
            flex: 1; padding: 6px 0; border: none;
            background: transparent; color: var(--text-secondary);
            font-size: 0.78rem; font-weight: 700; border-radius: 7px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 5px; transition: all 0.25s ease;
        }

        .tab-btn svg { width: 14px; height: 14px; stroke: currentColor; }
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 10px var(--primary-glow); }

        .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .filter-label { font-size: 0.7rem; color: var(--accent-cyan); font-weight: 600; white-space: nowrap; }

        .filter-chips { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 3px 8px; border-radius: 14px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass);
            font-size: 0.7rem; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
        }

        .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 2px 8px var(--primary-glow); }

        .search-box { position: relative; }

        .search-input {
            width: 100%; padding: 8px 12px 8px 36px;
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 10px; color: var(--text-primary); font-size: 0.82rem; outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--accent-cyan); }

        .outlet-card {
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 12px; margin-bottom: 8px;
            position: relative; overflow: hidden; transition: transform 0.2s ease, background 0.3s ease;
        }

        .outlet-card:active { transform: scale(0.988); }
        .outlet-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .outlet-card.visited { background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); }
        .outlet-card.visited::before { background: var(--accent-green); }

        .outlet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .outlet-code-row { display: flex; align-items: center; gap: 6px; }
        .outlet-code { font-size: 1rem; font-weight: 800; color: var(--accent-cyan); }

        .visited-badge {
            background: var(--accent-green); color: #06110d;
            font-size: 0.62rem; font-weight: 800; padding: 2px 6px;
            border-radius: 20px; text-transform: uppercase;
        }

        .rso-text { font-size: 0.75rem; color: var(--text-secondary); }
        .rso-text strong { color: var(--text-primary); }

        .dist-pill {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--accent-cyan); padding: 3px 7px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
        }

        .status-tag { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
        .status-y { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-n { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }

        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-glass); gap: 6px;
        }

        .check-container {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); cursor: pointer;
        }

        .custom-check {
            width: 16px; height: 16px; border-radius: 5px;
            border: 2px solid var(--border-highlight); display: flex; align-items: center;
            justify-content: center; background: rgba(0, 0, 0, 0.2); transition: all 0.2s ease;
        }

        .check-container input { display: none; }
        .check-container input:checked ~ .custom-check { background: var(--accent-green); border-color: var(--accent-green); }
        .custom-check svg { width: 9px; height: 9px; stroke: #0f0b08; stroke-width: 3; opacity: 0; }
        .check-container input:checked ~ .custom-check svg { opacity: 1; }

        .btn-action-group { display: flex; gap: 5px; }

        .btn-sm {
            background: rgba(255, 255, 255, 0.05); color: var(--text-secondary);
            border: 1px solid var(--border-glass); padding: 4px 8px; border-radius: 6px;
            font-size: 0.72rem; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; gap: 3px; transition: all 0.2s ease;
        }

        .btn-sm:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }

        .btn-nav {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(6, 182, 212, 0.2) 100%);
            color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.4);
        }

        /* Map View Container */
        #mapView {
            display: none; width: 100%; height: 68vh;
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); position: relative;
        }

        #map { width: 100%; height: 100%; background: #0b0f19; }

        .user-gps-container { 
            position: relative; 
            width: 24px; 
            height: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .user-heading-cone {
            position: absolute; 
            width: 0; 
            height: 0;
            border-left: 8px solid transparent; 
            border-right: 8px solid transparent;
            border-bottom: 22px solid rgba(99, 102, 241, 0.85); 
            top: -12px;
            transform-origin: 50% 100%; 
            pointer-events: none;
            transition: transform 0.15s ease-out;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .user-gps-dot {
            width: 14px; height: 14px; background: var(--primary);
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 12px var(--primary); z-index: 2;
        }

        /* Bottom Control Bar */
        .bottom-bar {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 24px); max-width: 520px;
            background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-highlight);
            border-radius: 14px; padding: 8px 12px; display: flex;
            align-items: center; justify-content: space-between;
            box-shadow: 0 16px 36px rgba(0,0,0,0.6); z-index: 500;
        }

        .counter-info { display: flex; flex-direction: column; }
        .counter-num { font-size: 0.82rem; font-weight: 800; color: var(--text-primary); }
        .counter-label { font-size: 0.65rem; color: var(--accent-cyan); }

        .btn-group-bottom { display: flex; gap: 6px; }

        .btn-export {
            background: rgba(16, 185, 129, 0.15); color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3); padding: 5px 10px;
            border-radius: 7px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
        }

        .btn-reset-small {
            background: rgba(244, 63, 94, 0.1); color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.25); padding: 5px 10px;
            border-radius: 7px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
        }

        /* Modals & Popups */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--bg-dark); border: 1px solid var(--border-highlight);
            border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
            padding: 16px; transform: translateY(100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column; gap: 10px;
        }

        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); }
        .modal-close { background: transparent; border: none; color: var(--accent-cyan); font-size: 1.1rem; cursor: pointer; }

        .app-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }

        .app-opt {
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 10px; padding: 10px 6px; display: flex; flex-direction: column;
            align-items: center; gap: 5px; cursor: pointer; text-decoration: none;
            color: var(--text-primary); font-size: 0.72rem; font-weight: 700;
        }

        .map-popup-btn {
            width: 100%; margin-top: 5px; padding: 5px; border-radius: 6px;
            border: none; background: var(--primary); color: #fff; font-weight: 700;
            font-size: 0.72rem; cursor: pointer;
        }

        .notes-input {
            width: 100%; height: 75px; background: var(--surface-card);
            border: 1px solid var(--border-glass); border-radius: 8px; padding: 8px;
            color: #fff; font-size: 0.82rem; outline: none; resize: none;
        }

        .toast {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--primary); color: #fff;
            padding: 6px 14px; border-radius: 30px; font-weight: 700; font-size: 0.78rem;
            box-shadow: 0 10px 25px var(--primary-glow); z-index: 1000;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand">
            <div class="brand-icon">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <h1>Outlet Nearby Ultra</h1>
        </div>
        <div class="header-actions">
            <label for="csvFileInput" class="btn-upload-compact">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                Import CSV
            </label>
            <input type="file" id="csvFileInput" accept=".csv">
            <div class="gps-status-pill" onclick="requestCompassPermission()">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">GPS</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="glass-card-compact">
        <div class="view-toggle-bar">
            <button id="listViewTab" class="tab-btn active" onclick="switchView('list')">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                List
            </button>
            <button id="mapViewTab" class="tab-btn" onclick="switchView('map')">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                Map
            </button>
        </div>

        <div class="filter-row">
            <span class="filter-label">Radius:</span>
            <div class="filter-chips">
                <div class="chip" onclick="setRadius(25, this)">25m</div>
                <div class="chip active" onclick="setRadius(50, this)">50m</div>
                <div class="chip" onclick="setRadius(100, this)">100m</div>
                <div class="chip" onclick="setRadius(500, this)">500m</div>
                <div class="chip" onclick="setRadius(50000, this)">All</div>
            </div>
        </div>
        
        <div class="filter-row">
            <span class="filter-label">Status:</span>
            <div class="filter-chips">
                <div class="chip active" onclick="setStatusFilter('ALL', this)">All</div>
                <div class="chip" onclick="setStatusFilter('UNVISITED', this)">Unvisited</div>
                <div class="chip" onclick="setStatusFilter('VISITED', this)">Visited</div>
                <div class="chip" onclick="setStatusFilter('STATUS_Y', this)">Status Y</div>
                <div class="chip" onclick="setStatusFilter('STATUS_N', this)">Status N</div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <svg class="search-icon" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search Code, RSO, or Status..." oninput="updateNearbyList()">
    </div>

    <div id="listView">
        <div id="retailerList">
            <div class="empty-card" style="text-align: center; padding: 28px 16px; background: var(--surface-glass); border: 1px dashed var(--border-glass); border-radius: 14px;">
                <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">No Outlets Loaded</p>
                <p style="font-size: 0.75rem; color: var(--accent-cyan); margin-top: 4px;">Tap "Import CSV" at the top right to start.</p>
            </div>
        </div>
    </div>

    <div id="mapView">
        <div id="map"></div>
    </div>
</div>

<div class="bottom-bar">
    <div class="counter-info">
        <span id="retailerCount" class="counter-num">0 Outlets</span>
        <span id="visitedCount" class="counter-label">0 visited this month</span>
    </div>
    <div class="btn-group-bottom">
        <button class="btn-export" onclick="exportVisitReport()">Export CSV</button>
        <button class="btn-reset-small" onclick="clearVisitHistory()">Reset Month</button>
    </div>
</div>

<!-- Navigation Modal -->
<div id="navModal" class="modal-overlay" onclick="closeModal('navModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title">Navigate To Outlet</span>
            <button class="modal-close" onclick="closeModal('navModal')">&times;</button>
        </div>
        <p style="font-size:0.75rem; color:var(--text-secondary);" id="navModalSub">Select preferred map provider:</p>
        <div class="app-picker-grid">
            <a id="gmapsLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="var(--primary)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                Google
            </a>
            <a id="wazeLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="var(--accent-cyan)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Waze
            </a>
            <a id="appleLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="var(--accent-green)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                Apple
            </a>
        </div>
        <button class="map-popup-btn" style="margin-top:8px;" id="drawRouteBtn">Draw Live Route</button>
    </div>
</div>

<!-- Notes Modal -->
<div id="notesModal" class="modal-overlay" onclick="closeModal('notesModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="notesModalTitle">Outlet Details</span>
            <button class="modal-close" onclick="closeModal('notesModal')">&times;</button>
        </div>
        <textarea id="noteInput" class="notes-input" placeholder="Type visit details, order notes..."></textarea>
        <div style="display:flex; gap:8px; align-items:center;">
            <label class="btn-sm" style="flex:1; justify-content:center; cursor:pointer;">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Watermarked Camera
                <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handleWatermarkedPhotoUpload(event)">
            </label>
            <button class="map-popup-btn" style="flex:1; margin:0;" onclick="saveNotes()">Save Details</button>
        </div>
        <div id="photoPreviewContainer" style="display:none; margin-top:6px;">
            <img id="photoPreview" style="width:100%; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--border-glass);" src="" alt="Preview">
        </div>
    </div>
</div>

<div id="toast" class="toast"><span id="toastMsg">Ready</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'outlet-ultra-violet-v1';
            self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['/']))));
            self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    let db;
    const dbReq = indexedDB.open("OutletUltraDB", 2);
    dbReq.onupgradeneeded = e => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("outlets")) {
            db.createObjectStore("outlets", { keyPath: "code" });
        }
    };
    dbReq.onsuccess = e => {
        db = e.target.result;
        loadOutletsFromStorage();
    };

    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist();
    }

    let retailers = [];
    let currentLat = null, currentLon = null, currentAccuracy = 0, currentHeading = 0;
    let deviceHeading = 0;
    let targetRadius = 50;
    let statusFilter = 'ALL';
    let activeView = 'list';

    let map = null, userMarker = null, userAccuracyCircle = null, storeClusterLayer = null;
    let activePopupMarker = null, popupTimer = null, osrmPolyline = null;
    let activeNoteStoreCode = null, tempPhotoBase64 = null;

    function loadOutletsFromStorage() {
        if (!db) return;
        const tx = db.transaction("outlets", "readonly");
        const store = tx.objectStore("outlets");
        const req = store.getAll();
        req.onsuccess = () => {
            retailers = req.result || [];
            updateCounters();
            updateNearbyList();
        };
    }

    function saveAllOutletsToDB() {
        if (!db) return;
        const tx = db.transaction("outlets", "readwrite");
        const store = tx.objectStore("outlets");
        store.clear();
        retailers.forEach(item => store.put(item));
    }

    function switchView(view) {
        activeView = view;
        const listViewEl = document.getElementById('listView');
        const mapViewEl = document.getElementById('mapView');
        const listTab = document.getElementById('listViewTab');
        const mapTab = document.getElementById('mapViewTab');

        if (view === 'list') {
            listViewEl.style.display = 'block';
            mapViewEl.style.display = 'none';
            listTab.classList.add('active');
            mapTab.classList.remove('active');
        } else {
            listViewEl.style.display = 'none';
            mapViewEl.style.display = 'block';
            mapTab.classList.add('active');
            listTab.classList.remove('active');

            if (!map) initMap();
            else setTimeout(() => map.invalidateSize(), 100);
            updateMapView();
        }
    }

    function initMap() {
        const startLat = currentLat || 23.8103;
        const startLon = currentLon || 90.4125;

        map = L.map('map', { zoomControl: false }).setView([startLat, startLon], 18);

        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        storeClusterLayer = L.markerClusterGroup({
            disableClusteringAtZoom: 17,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false
        }).addTo(map);

        map.on('popupopen', e => {
            activePopupMarker = e.popup._source;
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => map.closePopup(), 10000);
        });

        map.on('popupclose', () => {
            activePopupMarker = null;
            clearTimeout(popupTimer);
        });
    }

    function setRadius(meters, el) {
        targetRadius = meters;
        el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        updateNearbyList();
        showToast(meters >= 50000 ? "Showing All Outlets" : `Radius set to ${meters}m`);
    }

    function setStatusFilter(filterVal, el) {
        statusFilter = filterVal;
        el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        updateNearbyList();
    }

    function parseCSVLine(line) {
        const result = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') inQuotes = !inQuotes;
            else if (c === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else cur += c;
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => parseCSV(evt.target.result);
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;
        const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());
        let latIdx = headers.findIndex(h => h.includes('lat'));
        let lonIdx = headers.findIndex(h => h.includes('lon') || h.includes('lng'));

        retailers = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const cols = parseCSVLine(line);
            if (cols.length < 3) continue;

            let retailerCode = '';
            for (let c = 0; c < cols.length; c++) {
                if (/^R\d{5,7}$/i.test(cols[c].trim())) {
                    retailerCode = cols[c].trim().toUpperCase();
                    break;
                }
            }
            if (!retailerCode && cols[2]) retailerCode = cols[2].trim();
            const rsoCode = cols[1] ? cols[1].trim() : 'N/A';
            let statusVal = cols[7] ? cols[7].trim().toUpperCase() : (cols.length >= 8 ? cols[cols.length - 1].trim().toUpperCase() : 'N/A');

            let lat = parseFloat(cols[latIdx !== -1 ? latIdx : 5]);
            let lon = parseFloat(cols[lonIdx !== -1 ? lonIdx : 6]);

            if (isNaN(lat) || isNaN(lon)) {
                for (let c = 0; c < cols.length; c++) {
                    const val = parseFloat(cols[c]);
                    if (!isNaN(val) && val > 5 && val < 40) lat = val;
                    if (!isNaN(val) && val > 60 && val < 100) lon = val;
                }
            }

            if (!isNaN(lat) && !isNaN(lon) && retailerCode) {
                retailers.push({
                    code: retailerCode,
                    rso: rsoCode,
                    lat: lat,
                    lon: lon,
                    status: statusVal,
                    visited: false,
                    visitDate: null,
                    notes: '',
                    photo: null
                });
            }
        }

        saveAllOutletsToDB();
        updateCounters();
        updateNearbyList();
        showToast(`Loaded ${retailers.length} outlets`);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function updateNearbyList() {
        const listContainer = document.getElementById('retailerList');
        const searchVal = document.getElementById('searchInput').value.toUpperCase().trim();

        if (retailers.length === 0) {
            listContainer.innerHTML = `
                <div class="empty-card" style="text-align: center; padding: 28px 16px; background: var(--surface-glass); border: 1px dashed var(--border-glass); border-radius: 14px;">
                    <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">No Outlets Loaded</p>
                    <p style="font-size: 0.75rem; color: var(--accent-cyan); margin-top: 4px;">Tap "Import CSV" at the top right to start.</p>
                </div>`;
            return;
        }

        let filtered = retailers.map(item => {
            const dist = (currentLat !== null && currentLon !== null) 
                ? calculateDistance(currentLat, currentLon, item.lat, item.lon) 
                : 9999999;
            return { ...item, dist };
        });

        if (currentLat !== null && currentLon !== null) {
            filtered.sort((a, b) => a.dist - b.dist);
        }

        filtered = filtered.filter(item => {
            if (targetRadius < 50000 && item.dist > targetRadius) return false;
            
            if (statusFilter === 'VISITED' && !item.visited) return false;
            if (statusFilter === 'UNVISITED' && item.visited) return false;
            if (statusFilter === 'STATUS_Y' && item.status !== 'Y') return false;
            if (statusFilter === 'STATUS_N' && item.status !== 'N') return false;

            if (searchVal) {
                const matchCode = item.code.toUpperCase().includes(searchVal);
                const matchRso = item.rso.toUpperCase().includes(searchVal);
                const matchStatus = item.status.toUpperCase().includes(searchVal);
                return matchCode || matchRso || matchStatus;
            }

            return true;
        });

        if (filtered.length === 0) {
            listContainer.innerHTML = `
                <div class="empty-card" style="text-align: center; padding: 28px 16px; background: var(--surface-glass); border: 1px dashed var(--border-glass); border-radius: 14px;">
                    <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">No Outlets Found</p>
                    <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px;">Try expanding your radius or clear filters.</p>
                </div>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            const distText = item.dist < 999990 ? (item.dist < 1000 ? `${Math.round(item.dist)}m` : `${(item.dist/1000).toFixed(1)}km`) : 'N/A';
            const statusClass = item.status === 'Y' ? 'status-y' : (item.status === 'N' ? 'status-n' : '');

            html += `
                <div class="outlet-card ${item.visited ? 'visited' : ''}">
                    <div class="outlet-header">
                        <div class="outlet-code-row">
                            <span class="outlet-code">${item.code}</span>
                            ${item.visited ? '<span class="visited-badge">Visited</span>' : ''}
                        </div>
                        <div style="display:flex; gap:4px; align-items:center;">
                            <span class="status-tag ${statusClass}">${item.status}</span>
                            <span class="dist-pill">${distText}</span>
                        </div>
                    </div>
                    <div class="rso-text">RSO: <strong>${item.rso}</strong></div>
                    ${item.notes ? `<div style="font-size:0.72rem; color:var(--text-secondary); margin-top:4px; font-style:italic;">"${item.notes}"</div>` : ''}
                    
                    <div class="card-footer">
                        <label class="check-container">
                            <input type="checkbox" ${item.visited ? 'checked' : ''} onchange="toggleVisit('${item.code}')">
                            <div class="custom-check">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5"/></svg>
                            </div>
                            <span>Mark Visited</span>
                        </label>
                        <div class="btn-action-group">
                            <button class="btn-sm" onclick="openNotesModal('${item.code}')">Details</button>
                            <button class="btn-sm btn-nav" onclick="openNavModal(${item.lat}, ${item.lon}, '${item.code}')">Nav</button>
                        </div>
                    </div>
                </div>
            `;
        });

        listContainer.innerHTML = html;
        if (activeView === 'map') updateMapView();
    }

    function updateMapView() {
        if (!map || !storeClusterLayer) return;

        storeClusterLayer.clearLayers();

        const bounds = L.latLngBounds();
        if (currentLat !== null && currentLon !== null) {
            bounds.extend([currentLat, currentLon]);
        }

        retailers.forEach(item => {
            const dist = (currentLat !== null && currentLon !== null) 
                ? calculateDistance(currentLat, currentLon, item.lat, item.lon) 
                : 0;

            if (targetRadius < 50000 && dist > targetRadius) return;
            if (statusFilter === 'VISITED' && !item.visited) return;
            if (statusFilter === 'UNVISITED' && item.visited) return;
            if (statusFilter === 'STATUS_Y' && item.status !== 'Y') return;
            if (statusFilter === 'STATUS_N' && item.status !== 'N') return;

            const markerColor = item.visited ? '#10b981' : '#6366f1';
            const iconHtml = `<div style="background-color:${markerColor}; width:12px; height:12px; border-radius:50%; border:2px solid white; box-shadow:0 0 6px ${markerColor};"></div>`;
            
            const customIcon = L.divIcon({
                html: iconHtml,
                className: 'custom-map-pin',
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });

            const marker = L.marker([item.lat, item.lon], { icon: customIcon });
            
            const popupContent = `
                <div style="font-size:0.8rem; font-weight:700; color:#0f172a; font-family:sans-serif;">
                    <div>${item.code} (${item.status})</div>
                    <div style="font-weight:500; font-size:0.72rem; color:#475569;">RSO: ${item.rso}</div>
                    <button class="map-popup-btn" onclick="toggleVisit('${item.code}')">${item.visited ? 'Mark Unvisited' : 'Mark Visited'}</button>
                </div>
            `;
            marker.bindPopup(popupContent);
            storeClusterLayer.addLayer(marker);
            bounds.extend([item.lat, item.lon]);
        });
    }

    function toggleVisit(code) {
        const item = retailers.find(r => r.code === code);
        if (item) {
            item.visited = !item.visited;
            item.visitDate = item.visited ? new Date().toISOString() : null;
            saveAllOutletsToDB();
            updateCounters();
            updateNearbyList();
            showToast(item.visited ? `Marked ${code} visited` : `Cleared visit for ${code}`);
        }
    }

    function updateCounters() {
        document.getElementById('retailerCount').innerText = `${retailers.length} Outlets`;
        const visited = retailers.filter(r => r.visited).length;
        document.getElementById('visitedCount').innerText = `${visited} visited this month`;
    }

    function openNavModal(lat, lon, code) {
        document.getElementById('navModalSub').innerText = `Navigating to: ${code}`;
        document.getElementById('gmapsLink').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
        document.getElementById('wazeLink').href = `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`;
        document.getElementById('appleLink').href = `http://maps.apple.com/?daddr=${lat},${lon}`;
        
        document.getElementById('drawRouteBtn').onclick = () => {
            closeModal('navModal');
            switchView('map');
            drawOSRMRoute(lat, lon);
        };

        document.getElementById('navModal').classList.add('active');
    }

    function openNotesModal(code) {
        activeNoteStoreCode = code;
        const item = retailers.find(r => r.code === code);
        if (!item) return;

        document.getElementById('notesModalTitle').innerText = `Details: ${code}`;
        document.getElementById('noteInput').value = item.notes || '';
        
        const previewContainer = document.getElementById('photoPreviewContainer');
        const previewImg = document.getElementById('photoPreview');
        if (item.photo) {
            previewImg.src = item.photo;
            previewContainer.style.display = 'block';
        } else {
            previewContainer.style.display = 'none';
        }

        document.getElementById('notesModal').classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function saveNotes() {
        if (!activeNoteStoreCode) return;
        const item = retailers.find(r => r.code === activeNoteStoreCode);
        if (item) {
            item.notes = document.getElementById('noteInput').value;
            if (tempPhotoBase64) {
                item.photo = tempPhotoBase64;
                tempPhotoBase64 = null;
            }
            saveAllOutletsToDB();
            updateNearbyList();
            closeModal('notesModal');
            showToast("Details saved!");
        }
    }

    function handleWatermarkedPhotoUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const timeStr = new Date().toLocaleString();
                const watermarkText = `${activeNoteStoreCode || ''} | ${timeStr} | Lat:${currentLat?.toFixed(4)} Lon:${currentLon?.toFixed(4)}`;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

                ctx.fillStyle = '#ffffff';
                ctx.font = `${Math.max(14, Math.floor(canvas.height / 30))}px sans-serif`;
                ctx.fillText(watermarkText, 10, canvas.height - 12);

                tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('photoPreview').src = tempPhotoBase64;
                document.getElementById('photoPreviewContainer').style.display = 'block';
            };
            img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }

    function drawOSRMRoute(destLat, destLon) {
        if (currentLat === null || currentLon === null) {
            showToast("Location unavailable!");
            return;
        }

        const url = `https://router.project-osrm.org/route/v1/driving/${currentLon},${currentLat};${destLon},${destLat}?overview=full&geometries=geojson`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.routes && data.routes[0]) {
                    if (osrmPolyline) map.removeLayer(osrmPolyline);
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    osrmPolyline = L.polyline(coords, { color: '#06b6d4', weight: 5, opacity: 0.8 }).addTo(map);
                    map.fitBounds(osrmPolyline.getBounds(), { padding: [30, 30] });
                    showToast("Route drawn successfully!");
                }
            })
            .catch(() => showToast("Failed to fetch route."));
    }

    function exportVisitReport() {
        const visitedItems = retailers.filter(r => r.visited);
        if (visitedItems.length === 0) {
            showToast("No visits to export!");
            return;
        }

        let csv = "Code,RSO,Status,VisitDate,Notes\n";
        visitedItems.forEach(item => {
            csv += `"${item.code}","${item.rso}","${item.status}","${item.visitDate || ''}","${(item.notes || '').replace(/"/g, '""')}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Outlet_Visits_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
    }

    function clearVisitHistory() {
        if (confirm("Reset all visit data for this month?")) {
            retailers.forEach(r => {
                r.visited = false;
                r.visitDate = null;
            });
            saveAllOutletsToDB();
            updateCounters();
            updateNearbyList();
            showToast("Visit history reset!");
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function startGPSWatcher() {
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(
                pos => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    currentAccuracy = pos.coords.accuracy;
                    currentHeading = pos.coords.heading;

                    document.getElementById('statusDot').classList.add('active');
                    document.getElementById('statusText').innerText = "GPS Live";

                    updateUserMapMarker();
                    updateNearbyList();
                },
                err => {
                    document.getElementById('statusDot').classList.remove('active');
                    document.getElementById('statusText').innerText = "GPS Off";
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
            );
        }
    }

    function updateUserMapMarker() {
        if (!map || currentLat === null || currentLon === null) return;

        const effectiveHeading = (currentHeading !== null && !isNaN(currentHeading)) ? currentHeading : deviceHeading;

        if (!userMarker) {
            const userIcon = L.divIcon({
                className: 'user-marker-icon',
                html: `
                    <div class="user-gps-container">
                        <div class="user-heading-cone" id="userHeadingCone" style="transform: rotate(${effectiveHeading}deg);"></div>
                        <div class="user-gps-dot"></div>
                    </div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            userMarker = L.marker([currentLat, currentLon], { icon: userIcon, zIndexOffset: 1000 }).addTo(map);
            userAccuracyCircle = L.circle([currentLat, currentLon], { radius: currentAccuracy, color: '#6366f1', fillColor: '#6366f1', fillOpacity: 0.15, weight: 1 }).addTo(map);
        } else {
            userMarker.setLatLng([currentLat, currentLon]);
            userAccuracyCircle.setLatLng([currentLat, currentLon]);
            userAccuracyCircle.setRadius(currentAccuracy);

            const cone = document.getElementById('userHeadingCone');
            if (cone) cone.style.transform = `rotate(${effectiveHeading}deg)`;
        }
    }

    function requestCompassPermission() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(state => {
                    if (state === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                })
                .catch(() => {});
        } else {
            window.addEventListener('deviceorientationAbsolute', handleOrientation, true) ||
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
        startGPSWatcher();
    }

    function handleOrientation(e) {
        let compass = e.webkitCompassHeading || e.alpha;
        if (compass !== undefined && compass !== null) {
            deviceHeading = compass;
            const cone = document.getElementById('userHeadingCone');
            if (cone) cone.style.transform = `rotate(${deviceHeading}deg)`;
        }
    }

    startGPSWatcher();
</script>
</body>
</html>
