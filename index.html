<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Outlet Nearby Ultra Pro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        :root {
            --bg-dark: #090d16;
            --surface-glass: rgba(18, 24, 38, 0.85);
            --surface-card: rgba(26, 34, 53, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-highlight: rgba(255, 255, 255, 0.2);
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-rose: #f43f5e;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 560px;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(9, 13, 22, 0.85);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { display: flex; align-items: center; gap: 8px; }

        .brand-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-cyan) 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-icon svg { width: 16px; height: 16px; stroke: #fff; }

        h1 {
            font-size: 1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .btn-upload-compact {
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-upload-compact:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--primary);
            color: #fff;
        }

        .gps-status-pill {
            display: flex; align-items: center; gap: 5px;
            padding: 4px 8px; border-radius: 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            font-size: 0.7rem; font-weight: 600;
            color: var(--text-secondary);
        }

        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-rose); }
        .status-dot.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

        input[type="file"] { display: none; }

        .container {
            width: 100%; max-width: 560px;
            padding: 12px 16px; display: flex;
            flex-direction: column; gap: 10px;
        }

        .glass-card-compact {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 14px; padding: 10px 12px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .view-toggle-bar {
            display: flex;
            background: rgba(10, 15, 26, 0.6);
            padding: 3px; border-radius: 10px;
            border: 1px solid var(--border-glass);
            gap: 4px;
        }

        .tab-btn {
            flex: 1; padding: 6px 0; border: none;
            background: transparent; color: var(--text-muted);
            font-size: 0.78rem; font-weight: 700; border-radius: 7px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 5px; transition: all 0.25s ease;
        }

        .tab-btn svg { width: 14px; height: 14px; stroke: currentColor; }
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 10px var(--primary-glow); }

        .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .filter-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; white-space: nowrap; }

        .filter-chips { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 3px 8px; border-radius: 14px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass);
            font-size: 0.7rem; font-weight: 600; color: var(--text-secondary);
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
        }

        .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 2px 8px var(--primary-glow); }

        .search-box { position: relative; }

        .search-input {
            width: 100%; padding: 8px 12px 8px 36px;
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 10px; color: var(--text-primary); font-size: 0.82rem; outline: none;
            transition: all 0.25s ease;
        }

        .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--text-muted); }

        .outlet-card {
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 12px; margin-bottom: 8px;
            position: relative; overflow: hidden; transition: transform 0.2s ease, background 0.3s ease;
        }

        .outlet-card:active { transform: scale(0.988); }
        .outlet-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); }
        .outlet-card.visited { background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.2); }
        .outlet-card.visited::before { background: var(--accent-green); }

        .outlet-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .outlet-code-row { display: flex; align-items: center; gap: 6px; }
        .outlet-code { font-size: 1rem; font-weight: 800; color: #38bdf8; }

        .visited-badge {
            background: var(--accent-green); color: #06110d;
            font-size: 0.62rem; font-weight: 800; padding: 2px 6px;
            border-radius: 20px; text-transform: uppercase;
        }

        .rso-text { font-size: 0.75rem; color: var(--text-secondary); }
        .rso-text strong { color: var(--text-primary); }

        .dist-pill {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(16, 185, 129, 0.12); border: 1px solid var(--accent-green-glow);
            color: #34d399; padding: 3px 7px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
        }

        .status-tag { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
        .status-y { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-n { background: rgba(244, 63, 94, 0.15); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }

        .card-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-glass); gap: 6px;
        }

        .check-container {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); cursor: pointer;
        }

        .custom-check {
            width: 16px; height: 16px; border-radius: 5px;
            border: 2px solid var(--border-highlight); display: flex; align-items: center;
            justify-content: center; background: rgba(0, 0, 0, 0.2); transition: all 0.2s ease;
        }

        .check-container input { display: none; }
        .check-container input:checked ~ .custom-check { background: var(--accent-green); border-color: var(--accent-green); }
        .custom-check svg { width: 9px; height: 9px; stroke: #090d16; stroke-width: 3; opacity: 0; }
        .check-container input:checked ~ .custom-check svg { opacity: 1; }

        .btn-action-group { display: flex; gap: 5px; }

        .btn-sm {
            background: rgba(255, 255, 255, 0.05); color: var(--text-secondary);
            border: 1px solid var(--border-glass); padding: 4px 8px; border-radius: 6px;
            font-size: 0.72rem; font-weight: 700; cursor: pointer; display: flex;
            align-items: center; gap: 3px; transition: all 0.2s ease;
        }

        .btn-sm:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }

        .btn-nav {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(99, 102, 241, 0.2) 100%);
            color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);
        }

        #mapView {
            display: none; width: 100%; height: 68vh;
            border-radius: 14px; overflow: hidden;
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); position: relative;
        }

        #map { width: 100%; height: 100%; background: #e5e3df; }

        .user-gps-container { position: relative; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }

        .user-heading-cone {
            position: absolute; width: 0; height: 0;
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-bottom: 24px solid rgba(99, 102, 241, 0.4); top: -16px;
            transform-origin: bottom center; pointer-events: none;
        }

        .user-gps-dot {
            width: 14px; height: 14px; background: #6366f1;
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 12px #6366f1; z-index: 2;
        }

        .bottom-bar {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 24px); max-width: 520px;
            background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-highlight);
            border-radius: 14px; padding: 8px 12px; display: flex;
            align-items: center; justify-content: space-between;
            box-shadow: 0 16px 36px rgba(0,0,0,0.6); z-index: 500;
        }

        .counter-info { display: flex; flex-direction: column; }
        .counter-num { font-size: 0.82rem; font-weight: 800; color: var(--text-primary); }
        .counter-label { font-size: 0.65rem; color: var(--text-muted); }

        .btn-group-bottom { display: flex; gap: 6px; }

        .btn-export {
            background: rgba(16, 185, 129, 0.15); color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3); padding: 5px 10px;
            border-radius: 7px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
        }

        .btn-reset-small {
            background: rgba(244, 63, 94, 0.1); color: var(--accent-rose);
            border: 1px solid rgba(244, 63, 94, 0.25); padding: 5px 10px;
            border-radius: 7px; font-size: 0.72rem; font-weight: 700; cursor: pointer;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--bg-dark); border: 1px solid var(--border-highlight);
            border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
            padding: 16px; transform: translateY(100%); transition: transform 0.3s ease;
            display: flex; flex-direction: column; gap: 10px;
        }

        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.1rem; cursor: pointer; }

        .app-picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }

        .app-opt {
            background: var(--surface-card); border: 1px solid var(--border-glass);
            border-radius: 10px; padding: 10px 6px; display: flex; flex-direction: column;
            align-items: center; gap: 5px; cursor: pointer; text-decoration: none;
            color: var(--text-primary); font-size: 0.72rem; font-weight: 700;
        }

        .map-popup-btn {
            width: 100%; margin-top: 5px; padding: 5px; border-radius: 6px;
            border: none; background: var(--primary); color: #fff; font-weight: 700;
            font-size: 0.72rem; cursor: pointer;
        }

        .notes-input {
            width: 100%; height: 75px; background: var(--surface-card);
            border: 1px solid var(--border-glass); border-radius: 8px; padding: 8px;
            color: #fff; font-size: 0.82rem; outline: none; resize: none;
        }

        .toast {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(16, 185, 129, 0.95); color: #042f2e;
            padding: 6px 14px; border-radius: 30px; font-weight: 700; font-size: 0.78rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); z-index: 1000;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand">
            <div class="brand-icon">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <h1>Outlet Nearby Ultra</h1>
        </div>
        <div class="header-actions">
            <label for="csvFileInput" class="btn-upload-compact">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                Import CSV
            </label>
            <input type="file" id="csvFileInput" accept=".csv">
            <div class="gps-status-pill">
                <span id="statusDot" class="status-dot"></span>
                <span id="statusText">GPS</span>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="glass-card-compact">
        <div class="view-toggle-bar">
            <button id="listViewTab" class="tab-btn active" onclick="switchView('list')">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                List
            </button>
            <button id="mapViewTab" class="tab-btn" onclick="switchView('map')">
                <svg fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                Map
            </button>
        </div>

        <div class="filter-row">
            <span class="filter-label">Radius:</span>
            <div class="filter-chips">
                <div class="chip" onclick="setRadius(25, this)">25m</div>
                <div class="chip active" onclick="setRadius(50, this)">50m</div>
                <div class="chip" onclick="setRadius(100, this)">100m</div>
                <div class="chip" onclick="setRadius(500, this)">500m</div>
                <div class="chip" onclick="setRadius(50000, this)">All</div>
            </div>
        </div>
        
        <div class="filter-row">
            <span class="filter-label">Status:</span>
            <div class="filter-chips">
                <div class="chip active" onclick="setStatusFilter('ALL', this)">All</div>
                <div class="chip" onclick="setStatusFilter('UNVISITED', this)">Unvisited</div>
                <div class="chip" onclick="setStatusFilter('VISITED', this)">Visited</div>
                <div class="chip" onclick="setStatusFilter('STATUS_Y', this)">Status Y</div>
                <div class="chip" onclick="setStatusFilter('STATUS_N', this)">Status N</div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <svg class="search-icon" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search Code, RSO, or Status..." oninput="updateNearbyList()">
    </div>

    <div id="listView">
        <div id="retailerList">
            <div class="empty-card" style="text-align: center; padding: 28px 16px; background: var(--surface-glass); border: 1px dashed var(--border-glass); border-radius: 14px;">
                <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">No Outlets Loaded</p>
                <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Tap "Import CSV" at the top right to start.</p>
            </div>
        </div>
    </div>

    <div id="mapView">
        <div id="map"></div>
    </div>
</div>

<div class="bottom-bar">
    <div class="counter-info">
        <span id="retailerCount" class="counter-num">0 Outlets</span>
        <span id="visitedCount" class="counter-label">0 visited this month</span>
    </div>
    <div class="btn-group-bottom">
        <button class="btn-export" onclick="exportVisitReport()">Export CSV</button>
        <button class="btn-reset-small" onclick="clearVisitHistory()">Reset Month</button>
    </div>
</div>

<!-- Navigation Modal -->
<div id="navModal" class="modal-overlay" onclick="closeModal('navModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title">Navigate To Outlet</span>
            <button class="modal-close" onclick="closeModal('navModal')">&times;</button>
        </div>
        <p style="font-size:0.75rem; color:var(--text-muted);" id="navModalSub">Select preferred map provider:</p>
        <div class="app-picker-grid">
            <a id="gmapsLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="#06b6d4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                Google
            </a>
            <a id="wazeLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="#38bdf8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Waze
            </a>
            <a id="appleLink" target="_blank" class="app-opt">
                <svg width="20" height="20" fill="none" stroke="#a855f7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                Apple
            </a>
        </div>
        <button class="map-popup-btn" style="margin-top:8px;" id="drawRouteBtn">Draw Live Route</button>
    </div>
</div>

<!-- Notes Modal -->
<div id="notesModal" class="modal-overlay" onclick="closeModal('notesModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="notesModalTitle">Outlet Details</span>
            <button class="modal-close" onclick="closeModal('notesModal')">&times;</button>
        </div>
        <textarea id="noteInput" class="notes-input" placeholder="Type visit details, order notes..."></textarea>
        <div style="display:flex; gap:8px; align-items:center;">
            <label class="btn-sm" style="flex:1; justify-content:center; cursor:pointer;">
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Watermarked Camera
                <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handleWatermarkedPhotoUpload(event)">
            </label>
            <button class="map-popup-btn" style="flex:1; margin:0;" onclick="saveNotes()">Save Details</button>
        </div>
        <div id="photoPreviewContainer" style="display:none; margin-top:6px;">
            <img id="photoPreview" style="width:100%; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--border-glass);" src="" alt="Preview">
        </div>
    </div>
</div>

<div id="toast" class="toast"><span id="toastMsg">Ready</span></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE_NAME = 'outlet-ultra-v2';
            self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['/']))));
            self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    let db;
    const dbReq = indexedDB.open("OutletUltraDB", 2);
    dbReq.onupgradeneeded = e => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("outlets")) {
            db.createObjectStore("outlets", { keyPath: "code" });
        }
    };
    dbReq.onsuccess = e => {
        db = e.target.result;
        loadOutletsFromStorage();
    };

    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist();
    }

    let retailers = [];
    let currentLat = null, currentLon = null, currentAccuracy = 0, currentHeading = 0;
    let targetRadius = 50;
    let statusFilter = 'ALL';
    let activeView = 'list';

    let map = null, userMarker = null, userAccuracyCircle = null, storeClusterLayer = null;
    let activePopupMarker = null, popupTimer = null, osrmPolyline = null;
    let activeNoteStoreCode = null, tempPhotoBase64 = null;

    function loadOutletsFromStorage() {
        if (!db) return;
        const tx = db.transaction("outlets", "readonly");
        const store = tx.objectStore("outlets");
        const req = store.getAll();
        req.onsuccess = () => {
            retailers = req.result || [];
            updateCounters();
            updateNearbyList();
        };
    }

    function saveAllOutletsToDB() {
        if (!db) return;
        const tx = db.transaction("outlets", "readwrite");
        const store = tx.objectStore("outlets");
        store.clear();
        retailers.forEach(item => store.put(item));
    }

    function switchView(view) {
        activeView = view;
        const listViewEl = document.getElementById('listView');
        const mapViewEl = document.getElementById('mapView');
        const listTab = document.getElementById('listViewTab');
        const mapTab = document.getElementById('mapViewTab');

        if (view === 'list') {
            listViewEl.style.display = 'block';
            mapViewEl.style.display = 'none';
            listTab.classList.add('active');
            mapTab.classList.remove('active');
        } else {
            listViewEl.style.display = 'none';
            mapViewEl.style.display = 'block';
            mapTab.classList.add('active');
            listTab.classList.remove('active');

            if (!map) initMap();
            else setTimeout(() => map.invalidateSize(), 100);
            updateMapView();
        }
    }

    function initMap() {
        const startLat = currentLat || 23.8103;
        const startLon = currentLon || 90.4125;

        map = L.map('map', { zoomControl: false }).setView([startLat, startLon], 18);

        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        storeClusterLayer = L.markerClusterGroup({
            disableClusteringAtZoom: 17,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false
        }).addTo(map);

        map.on('popupopen', e => {
            activePopupMarker = e.popup._source;
            clearTimeout(popupTimer);
            popupTimer = setTimeout(() => map.closePopup(), 10000);
        });

        map.on('popupclose', () => {
            activePopupMarker = null;
            clearTimeout(popupTimer);
        });
    }

    function setRadius(meters, el) {
        targetRadius = meters;
        el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        updateNearbyList();
        showToast(meters >= 50000 ? "Showing All Outlets" : `Radius set to ${meters}m`);
    }

    function setStatusFilter(filterVal, el) {
        statusFilter = filterVal;
        el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        updateNearbyList();
    }

    function parseCSVLine(line) {
        const result = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const c = line[i];
            if (c === '"') inQuotes = !inQuotes;
            else if (c === ',' && !inQuotes) {
                result.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
            } else cur += c;
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
    }

    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => parseCSV(evt.target.result);
        reader.readAsText(file);
    });

    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        if (lines.length < 2) return;
        const headers = parseCSVLine(lines[0]).map(h => h.toLowerCase());
        let latIdx = headers.findIndex(h => h.includes('lat'));
        let lonIdx = headers.findIndex(h => h.includes('lon') || h.includes('lng'));

        retailers = [];
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            const cols = parseCSVLine(line);
            if (cols.length < 3) continue;

            let retailerCode = '';
            for (let c = 0; c < cols.length; c++) {
                if (/^R\d{5,7}$/i.test(cols[c].trim())) {
                    retailerCode = cols[c].trim().toUpperCase();
                    break;
                }
            }
            if (!retailerCode && cols[2]) retailerCode = cols[2].trim();
            const rsoCode = cols[1] ? cols[1].trim() : 'N/A';
            let statusVal = cols[7] ? cols[7].trim().toUpperCase() : (cols.length >= 8 ? cols[cols.length - 1].trim().toUpperCase() : 'N/A');

            let lat = parseFloat(cols[latIdx !== -1 ? latIdx : 5]);
            let lon = parseFloat(cols[lonIdx !== -1 ? lonIdx : 6]);

            if (isNaN(lat) || isNaN(lon)) {
                for (let c = 0; c < cols.length; c++) {
                    const val = parseFloat(cols[c]);
                    if (!isNaN(val) && val > 5 && val < 40) lat = val;
                    if (!isNaN(val) && val > 60 && val < 100) lon = val;
                }
            }

            if (!isNaN(lat) && !isNaN(lon) && retailerCode) {
                retailers.push({ 
                    code: retailerCode, 
                    rsoCode: rsoCode, 
                    lat: lat, 
                    lon: lon, 
                    status: statusVal,
                    visited: false,
                    visitDate: null,
                    notes: '',
                    photo: null
                });
            }
        }
        saveAllOutletsToDB();
        updateCounters();
        updateNearbyList();
        showToast(`Successfully imported ${retailers.length} outlets!`);
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Earth radius in meters
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function updateNearbyList() {
        const container = document.getElementById('retailerList');
        const searchQuery = document.getElementById('searchInput').value.toLowerCase();

        if (retailers.length === 0) {
            container.innerHTML = `
                <div class="empty-card" style="text-align: center; padding: 28px 16px; background: var(--surface-glass); border: 1px dashed var(--border-glass); border-radius: 14px;">
                    <p style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);">No Outlets Loaded</p>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Tap "Import CSV" at the top right to start.</p>
                </div>
            `;
            return;
        }

        let filtered = retailers.map(item => {
            let dist = currentLat !== null && currentLon !== null ? calculateDistance(currentLat, currentLon, item.lat, item.lon) : 0;
            return { ...item, distance: dist };
        });

        if (targetRadius < 50000 && currentLat !== null) {
            filtered = filtered.filter(item => item.distance <= targetRadius);
        }

        if (statusFilter === 'UNVISITED') filtered = filtered.filter(i => !i.visited);
        if (statusFilter === 'VISITED') filtered = filtered.filter(i => i.visited);
        if (statusFilter === 'STATUS_Y') filtered = filtered.filter(i => i.status.includes('Y'));
        if (statusFilter === 'STATUS_N') filtered = filtered.filter(i => i.status.includes('N'));

        if (searchQuery) {
            filtered = filtered.filter(i => 
                i.code.toLowerCase().includes(searchQuery) || 
                i.rsoCode.toLowerCase().includes(searchQuery) ||
                i.status.toLowerCase().includes(searchQuery)
            );
        }

        filtered.sort((a, b) => a.distance - b.distance);

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.8rem;">No outlets matching criteria within ${targetRadius}m.</div>`;
            return;
        }

        let html = '';
        filtered.forEach(item => {
            const statusClass = item.status.includes('Y') ? 'status-y' : 'status-n';
            html += `
                <div class="outlet-card ${item.visited ? 'visited' : ''}" id="card-${item.code}">
                    <div class="outlet-header">
                        <div class="outlet-code-row">
                            <span class="outlet-code">${item.code}</span>
                            ${item.visited ? '<span class="visited-badge">Visited</span>' : ''}
                        </div>
                        <span class="status-tag ${statusClass}">${item.status}</span>
                    </div>
                    <div class="rso-text">RSO: <strong>${item.rsoCode}</strong></div>
                    <div style="margin-top: 6px; display: flex; align-items: center; justify-content: space-between;">
                        <span class="dist-pill">
                            <svg width="10" height="10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                            ${Math.round(item.distance)}m away
                        </span>
                    </div>
                    <div class="card-footer">
                        <label class="check-container" onclick="toggleVisitStatus('${item.code}')">
                            <input type="checkbox" ${item.visited ? 'checked' : ''}>
                            <div class="custom-check">
                                <svg fill="none" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                            </div>
                            Mark Visited
                        </label>
                        <div class="btn-action-group">
                            <button class="btn-sm" onclick="openNotesModal('${item.code}')">Details</button>
                            <button class="btn-sm btn-nav" onclick="openNavModal('${item.code}', ${item.lat}, ${item.lon})">Navigate</button>
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function updateMapView() {
        if (!map || !storeClusterLayer) return;
        storeClusterLayer.clearLayers();

        retailers.forEach(item => {
            const markerColor = item.visited ? '#10b981' : '#6366f1';
            const markerHtml = `<div style="background:${markerColor};width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px ${markerColor}"></div>`;
            const customIcon = L.divIcon({ html: markerHtml, className: 'custom-map-marker', iconSize: [14, 14] });

            const marker = L.marker([item.lat, item.lon], { icon: customIcon });
            marker.bindPopup(`
                <div style="font-family:'Plus Jakarta Sans',sans-serif; min-width: 140px;">
                    <div style="font-weight:800; font-size:0.9rem; color:#0f172a;">${item.code}</div>
                    <div style="font-size:0.75rem; color:#475569; margin-top:2px;">RSO: ${item.rsoCode}</div>
                    <button class="map-popup-btn" onclick="openNavModal('${item.code}', ${item.lat}, ${item.lon})">Navigate Now</button>
                </div>
            `);
            storeClusterLayer.addLayer(marker);
        });
    }

    function toggleVisitStatus(code) {
        const target = retailers.find(i => i.code === code);
        if (!target) return;
        target.visited = !target.visited;
        target.visitDate = target.visited ? new Date().toISOString() : null;
        saveAllOutletsToDB();
        updateCounters();
        updateNearbyList();
        if (activeView === 'map') updateMapView();
        showToast(target.visited ? `Marked ${code} as visited!` : `Unmarked visit for ${code}`);
    }

    function updateCounters() {
        const total = retailers.length;
        const visited = retailers.filter(i => i.visited).length;
        document.getElementById('retailerCount').innerText = `${total} Outlets`;
        document.getElementById('visitedCount').innerText = `${visited} visited this month`;
    }

    function clearVisitHistory() {
        if (!confirm("Reset all visit markings for this month?")) return;
        retailers.forEach(i => { i.visited = false; i.visitDate = null; });
        saveAllOutletsToDB();
        updateCounters();
        updateNearbyList();
        if (activeView === 'map') updateMapView();
        showToast("Monthly visits reset.");
    }

    function exportVisitReport() {
        let csv = "Outlet Code,RSO Code,Latitude,Longitude,Status,Visited,Visit Date,Notes\n";
        retailers.forEach(i => {
            csv += `"${i.code}","${i.rsoCode}",${i.lat},${i.lon},"${i.status}",${i.visited},"${i.visitDate || ''}","${(i.notes || '').replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Outlet_Visit_Report_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        showToast("Report exported successfully!");
    }

    function openNavModal(code, lat, lon) {
        activeNoteStoreCode = code;
        document.getElementById('navModalSub').innerText = `Navigate to Outlet: ${code}`;
        document.getElementById('gmapsLink').href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
        document.getElementById('wazeLink').href = `https://waze.com/ul?ll=${lat},${lon}&navigate=yes`;
        document.getElementById('appleLink').href = `http://maps.apple.com/?daddr=${lat},${lon}`;
        document.getElementById('drawRouteBtn').onclick = () => { closeModal('navModal'); drawOSRMRoute(lat, lon); };
        document.getElementById('navModal').classList.add('active');
    }

    function openNotesModal(code) {
        activeNoteStoreCode = code;
        const target = retailers.find(i => i.code === code);
        document.getElementById('notesModalTitle').innerText = `Outlet Details: ${code}`;
        document.getElementById('noteInput').value = target ? (target.notes || '') : '';
        tempPhotoBase64 = target ? (target.photo || null) : null;
        
        const preview = document.getElementById('photoPreviewContainer');
        const img = document.getElementById('photoPreview');
        if (tempPhotoBase64) {
            img.src = tempPhotoBase64;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
        document.getElementById('notesModal').classList.add('active');
    }

    function saveNotes() {
        const target = retailers.find(i => i.code === activeNoteStoreCode);
        if (target) {
            target.notes = document.getElementById('noteInput').value;
            if (tempPhotoBase64) target.photo = tempPhotoBase64;
            saveAllOutletsToDB();
            showToast("Details saved successfully!");
        }
        closeModal('notesModal');
    }

    function handleWatermarkedPhotoUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                // Add Watermark Banner
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, canvas.height - 60, canvas.width, 60);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(`Outlet: ${activeNoteStoreCode}`, 20, canvas.height - 32);
                ctx.fillText(`Time: ${new Date().toLocaleString()}`, 20, canvas.height - 10);

                tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.85);
                document.getElementById('photoPreview').src = tempPhotoBase64;
                document.getElementById('photoPreviewContainer').style.display = 'block';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function drawOSRMRoute(destLat, destLon) {
        if (currentLat === null || currentLon === null) {
            showToast("Waiting for GPS lock...");
            return;
        }
        switchView('map');
        const url = `https://router.project-osrm.org/route/v1/driving/${currentLon},${currentLat};${destLon},${destLat}?overview=full&geometries=geojson`;
        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data.routes && data.routes.length > 0) {
                    const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                    if (osrmPolyline) map.removeLayer(osrmPolyline);
                    osrmPolyline = L.polyline(coords, { color: '#6366f1', weight: 5, opacity: 0.8 }).addTo(map);
                    map.fitBounds(osrmPolyline.getBounds(), { padding: [50, 50] });
                    showToast("Live route drawn successfully!");
                }
            })
            .catch(() => showToast("Failed to draw route."));
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Initialize GPS tracking
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
            currentLat = pos.coords.latitude;
            currentLon = pos.coords.longitude;
            currentAccuracy = pos.coords.accuracy;
            currentHeading = pos.coords.heading || 0;

            document.getElementById('statusDot').classList.add('active');
            document.getElementById('statusText').innerText = `${Math.round(currentAccuracy)}m GPS`;

            if (map) {
                const latLng = [currentLat, currentLon];
                if (!userMarker) {
                    const gpsIcon = L.divIcon({
                        className: 'user-gps-container',
                        html: `<div class="user-heading-cone" style="transform: rotate(${currentHeading}deg)"></div><div class="user-gps-dot"></div>`,
                        iconSize: [24, 24]
                    });
                    userMarker = L.marker(latLng, { icon: gpsIcon }).addTo(map);
                    userAccuracyCircle = L.circle(latLng, { radius: currentAccuracy, color: '#6366f1', fillColor: '#6366f1', fillOpacity: 0.15, weight: 1 }).addTo(map);
                } else {
                    userMarker.setLatLng(latLng);
                    userAccuracyCircle.setLatLng(latLng);
                    userAccuracyCircle.setRadius(currentAccuracy);
                }
            }
            updateNearbyList();
        }, () => {
            document.getElementById('statusText').innerText = 'No GPS';
        }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
    }
</script>
</body>
</html>
